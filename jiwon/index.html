<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>농업 지원사업·행사 — 시·군 지원사업 접수와 지역 농업 행사 | 에이블팜</title>
<meta name="description" content="전국 시·군의 농업인 지원사업(유기질비료·유기농업자재 등) 접수 공고와 지역 농업 행사·교육을 마감이 가까운 순서로 모았습니다.">
<link rel="canonical" href="https://www.ablefarm.co.kr/jiwon/">
<meta property="og:type" content="website">
<meta property="og:title" content="농업 지원사업·행사 — 에이블팜">
<meta property="og:description" content="시·군 농업인 지원사업 접수와 지역 농업 행사를 한곳에.">
<meta property="og:url" content="https://www.ablefarm.co.kr/jiwon/">
<link rel="icon" href="../assets/logo.png">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root{--ink:#16241a;--green:#1E5C1E;--deep:#16271c;--leaf:#4a7c59;--cream:#faf7f0;--line:#e2ddce;--muted:#6b7565;
        --hot:#b42318;--hotbg:#fde5e2;--open:#2f7d4f;--openbg:#e3f2e7;--soon:#8a6514;--soonbg:#fbf0d6;--live:#1d5fa8;--livebg:#e2eefb}
  *{box-sizing:border-box}
  html,body{overflow-x:clip}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:"Pretendard",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--green)}
  header{max-width:1180px;margin:0 auto;padding:34px 24px 10px}
  .eyebrow{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--leaf)}
  h1{margin:6px 0 6px;font-size:34px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:15px;line-height:1.6;margin:0}
  .sum{max-width:1180px;margin:18px auto 0;padding:0 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .sum div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px}
  .sum b{display:block;font-size:30px;letter-spacing:-.02em}.sum span{font-size:13.5px;color:var(--muted);font-weight:600}
  .sum .h b{color:var(--hot)}.sum .o b{color:var(--open)}.sum .l b{color:var(--live)}
  .bar{max-width:1180px;margin:22px auto 0;padding:0 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:100px;padding:4px}
  .tabs button{font:inherit;font-size:14.5px;font-weight:700;border:0;background:none;padding:8px 16px;border-radius:100px;color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--deep);color:#fff}
  select{font:inherit;font-size:14.5px;font-weight:700;padding:9px 14px;border-radius:100px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .chk{font-size:14px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center;margin-left:auto}
  .note{max-width:1180px;margin:14px auto 0;padding:0 24px}
  .note p{margin:0;background:#fff8e6;border:1px solid #efdcaa;border-radius:14px;padding:11px 14px;font-size:13.5px;line-height:1.55;color:#5c4813}
  main{max-width:1180px;margin:18px auto 0;padding:0 24px 60px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:9px}
  .card.done{opacity:.55}
  .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .kind{font-size:12px;font-weight:800;color:var(--leaf);letter-spacing:.04em}
  .pill{font-size:12px;font-weight:800;padding:4px 9px;border-radius:100px}
  .p-hot{background:var(--hotbg);color:var(--hot)}.p-open{background:var(--openbg);color:var(--open)}.p-soon{background:var(--soonbg);color:var(--soon)}.p-live{background:var(--livebg);color:var(--live)}.p-done{background:#eee;color:#777}
  .dd{margin-left:auto;font-size:15px;font-weight:900;letter-spacing:-.01em}
  .card.hot .dd{color:var(--hot)}
  .card h3{margin:0;font-size:18px;line-height:1.35;letter-spacing:-.01em}
  .area{font-size:13.5px;font-weight:700;color:var(--muted)}
  .what{margin:0;font-size:14.5px;line-height:1.55;color:#33402f}
  dl{margin:0;display:grid;grid-template-columns:52px 1fr;gap:4px 8px;font-size:13.5px;line-height:1.5}
  dt{color:var(--muted);font-weight:700}dd{margin:0}
  .foot{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .jw-src{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:6px}
  .jw-s1{background:#e3f2e7;color:#2f7d4f}.jw-s2{background:#fbf0d6;color:#8a6514}.jw-s3{background:#eee;color:#666}
  .jw-go{font-size:13px;font-weight:700;text-decoration:none}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
  @media (max-width:980px){main{grid-template-columns:1fr 1fr}}
  @media (max-width:640px){header{padding:24px 16px 6px}h1{font-size:27px}.sum,.bar,.note{padding:0 16px}main{padding:0 16px 50px;grid-template-columns:1fr}
    .sum{gap:8px}.sum div{padding:12px}.sum b{font-size:24px}.sum span{font-size:12px}.chk{margin-left:0}}
</style>
<script src="/ga.js"></script>
</head>
<body>
<script src="/assets/site-nav.js" data-now="jiwon"></script>

<header>
  <div class="eyebrow">SUPPORT · EVENTS</div>
  <h1>농업 지원사업·행사</h1>
  <p class="sub">전국 시·군의 농업인 지원사업 접수와 지역 농업 행사를 한곳에 모았습니다. 마감이 가까운 것부터 보여 드립니다.<br><span id="stamp"></span></p>
</header>

<section class="sum">
  <div class="h"><b id="nHot">-</b><span>7일 안에 마감</span></div>
  <div class="o"><b id="nOpen">-</b><span>지금 접수 중</span></div>
  <div class="l"><b id="nEv">-</b><span>다가오는 행사</span></div>
</section>

<div class="bar">
  <div class="tabs" id="tabs"><button class="on" data-k="">전체</button><button data-k="지원사업">지원사업</button><button data-k="행사">행사</button></div>
  <select id="sido" aria-label="지역"></select>
  <label class="chk"><input type="checkbox" id="showDone"> 마감·끝난 것도 보기</label>
</div>

<div class="note"><p>⚠ 지원 금액·기간은 시·군마다 다르고 바뀔 수 있습니다. <b>신청 전에 꼭 「원문 보기」로 해당 기관 공고를 확인하세요.</b> 「보도 기준」·「2차 게시」는 기관 원문이 아닌 기사·재게시 자료입니다.</p></div>

<main id="list"></main>

<script src="jiwon-core.js"></script>
<script>
(function () {
  var E = JW.esc, D, kind = '', sido = '';
  var sel = document.getElementById('sido');
  JW.load().then(function (d) {
    D = d;
    document.getElementById('stamp').textContent = '자료 확인 ' + d.checked + ' · 게시판 갱신 ' + d.updated;
    var have = {}; d.items.forEach(function (it) { have[it.sido] = (have[it.sido] || 0) + (it.st.key !== 'done' ? 1 : 0); });
    sel.innerHTML = '<option value="">모든 지역</option>' + JW.SIDO.filter(function (s) { return have[s]; }).map(function (s) { return '<option>' + s + '</option>'; }).join('');
    var live = d.items.filter(function (it) { return it.st.key !== 'done'; });
    document.getElementById('nHot').textContent = live.filter(function (it) { return it.st.key === 'hot'; }).length;
    document.getElementById('nOpen').textContent = live.filter(function (it) { return it.kind === '지원사업' && (it.st.key === 'open' || it.st.key === 'hot'); }).length;
    document.getElementById('nEv').textContent = live.filter(function (it) { return it.kind === '행사'; }).length;
    draw();
  });
  function draw() {
    var all = document.getElementById('showDone').checked;
    var rows = D.items.filter(function (it) {
      return (!kind || it.kind === kind) && (!sido || it.sido === sido || it.sido === '전국') && (all || it.st.key !== 'done');
    });
    document.getElementById('list').innerHTML = rows.length ? rows.map(function (it) {
      var s = it.st;
      return '<article class="card ' + s.key + '">' +
        '<div class="top"><span class="kind">' + E(it.kind) + '</span><span class="pill p-' + s.key + '">' + s.label + '</span><span class="dd">' + E(s.d) + '</span></div>' +
        '<h3>' + E(it.title) + '</h3><div class="area">📍 ' + E(it.area) + '</div>' +
        '<p class="what">' + E(it.what) + '</p>' +
        '<dl><dt>' + (it.kind === '행사' ? '날짜' : '신청') + '</dt><dd>' + E(it.when) + '</dd><dt>' + (it.kind === '행사' ? '장소' : '신청처') + '</dt><dd>' + E(it.where) + '</dd>' + (it.who ? '<dt>대상</dt><dd>' + E(it.who) + '</dd>' : '') + '</dl>' +
        '<div class="foot">' + JW.srcBadge(it) + JW.srcLink(it) + '</div></article>';
    }).join('') : '<div class="empty">이 조건에 맞는 글이 아직 없습니다.</div>';
  }
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
    kind = b.getAttribute('data-k'); draw();
  });
  sel.addEventListener('change', function () { sido = sel.value; draw(); });
  document.getElementById('showDone').addEventListener('change', draw);
})();
</script>
</body>
</html>
