<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="현장처방">
<title>에이블팜 현장 처방</title>
<style>
  :root{
    --bg:#f5f2eb; --card:#ffffff; --ink:#15211b; --sub:#727a72; --line:#e9e3d7;
    --g:#0f3d2e; --g2:#1d6447; --g3:#2f8a62; --soft:#edf4ef; --ivory:#faf8f3;
    --gold:#b8955a; --gold2:#d8bd86; --goldbg:#f7f0e2;
    --warn:#fbf3e3; --warn-ink:#7d5512; --red:#9b2f27; --redbg:#fbecea;
    --sh:0 1px 2px rgba(15,61,46,.04),0 10px 28px rgba(15,61,46,.07);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--ink);font-family:"Pretendard",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;padding-bottom:110px;
    background:radial-gradient(900px 500px at 110% 18%,rgba(216,189,134,.16),transparent 60%),radial-gradient(700px 500px at -20% 55%,rgba(47,138,98,.07),transparent 60%),linear-gradient(180deg,#f6f3ec 0%,#f2eee4 100%);background-attachment:fixed;background-color:var(--bg)}
  button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  [hidden]{display:none !important}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .sec .eyebrow::before{content:"";width:18px;height:1.5px;background:linear-gradient(90deg,var(--gold),transparent)}

  /* 헤더 */
  header{background:linear-gradient(160deg,#0b3326 0%,#0f3d2e 45%,#195239 100%);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 0 78px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;border:1px solid rgba(216,189,134,.18);box-shadow:0 0 0 30px rgba(216,189,134,.04),0 0 0 60px rgba(216,189,134,.03)}
  .hi{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:1}
  .brand{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--gold2);margin:0 0 6px}
  .hi h1{margin:0;font-size:23px;font-weight:400;letter-spacing:-.03em}
  .hi h1 b{font-weight:800}
  .hi p{margin:3px 0 0;font-size:14px;color:#b9cfc2}
  .avatar{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--gold2);background:rgba(255,255,255,.06);color:var(--gold2);font-weight:800;font-size:17px;display:grid;place-items:center;flex:none}
  .searchbox{position:relative;margin-top:18px;z-index:2}
  .searchbox input{width:100%;padding:14px 16px 14px 46px;border-radius:16px;border:1px solid rgba(216,189,134,.28);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:16px;outline:none}
  .searchbox input::placeholder{color:#a9c2b4}
  .searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%)}
  .results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;color:var(--ink);border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,.22);z-index:20;max-height:60vh;overflow:auto;padding:6px}
  .results button{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:10px;border-radius:12px;text-align:left}
  .results button:hover{background:var(--soft)}
  .results img,.results .em{width:34px;height:38px;object-fit:contain;font-size:24px;text-align:center;line-height:38px}
  .results small{color:var(--sub);display:block;font-size:13px}

  /* 카드 */
  .card{background:linear-gradient(180deg,#fff 0%,#fffdf9 100%);border-radius:24px;padding:20px;margin-top:14px;box-shadow:var(--sh);border:1px solid rgba(184,149,90,.16)}
  .card h3{margin:0 0 12px;font-size:18px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h4{margin:18px 0 8px;font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.04em}
  .sub{color:var(--sub);font-size:14px}

  /* 날씨 */
  .weather{margin-top:-60px;position:relative;z-index:1}
  .w-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .w-place{border:none;background:none;padding:0;font-weight:700;font-size:15px;display:flex;align-items:center;gap:5px;text-align:left}
  .w-temp{font-size:52px;font-weight:300;letter-spacing:-.05em;line-height:1.05;margin-top:6px}
  .w-temp sup{font-size:22px;font-weight:400;vertical-align:28px;margin-left:2px}
  .w-hl{font-size:13px;color:var(--sub);margin-left:12px;display:inline-block;vertical-align:14px;line-height:1.45;letter-spacing:0}
  .w-icon{font-size:52px;line-height:1;text-align:right}
  .w-desc{text-align:right;font-size:14px;font-weight:700;color:var(--sub)}
  .w-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
  .w-grid div{font-size:12px;color:var(--sub)}
  .w-grid b{display:block;font-size:16px;color:var(--ink);font-weight:700}
  .advice{margin-top:14px;border-radius:16px;padding:12px 14px;font-size:15px;font-weight:700;background:var(--g);color:#fff}
  .advice.bad{background:var(--warn);color:var(--warn-ink)}
  .advice small{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:2px}
  .regions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .regions button{border:1px solid var(--line);background:var(--ivory);border-radius:10px;padding:8px 2px;font-size:13px;font-weight:700}

  /* 섹션 */
  .sec{display:flex;justify-content:space-between;align-items:flex-end;margin:26px 2px 12px}
  .sec h2{margin:2px 0 0;font-size:19px;font-weight:800;letter-spacing:-.03em}
  .sec .acts{display:flex;gap:6px}
  .link{border:1px solid rgba(15,61,46,.18);background:linear-gradient(180deg,#fff,var(--ivory));color:var(--g);font-weight:800;font-size:13px;padding:7px 13px;border-radius:999px;box-shadow:0 2px 6px rgba(15,61,46,.06)}
  .link.gold{border-color:var(--gold);color:#fff;background:linear-gradient(150deg,#c9a86a,#a8844a);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px rgba(168,132,74,.3)}

  .tiles{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:none}
  .tiles::-webkit-scrollbar{display:none}
  .tiles.grid{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible;margin:0;padding:2px 0 10px}
  .tile{flex:none;width:74px;background:none;border:none;padding:0;text-align:center}
  .tiles.grid .tile{width:auto}
  .tile .em{width:62px;height:62px;margin:0 auto;border-radius:20px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;font-size:28px;border:1.5px solid transparent;transition:all .15s}
  .tile span:last-child{display:block;font-size:13px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
  .tile .em img{width:50px;height:50px;object-fit:contain;display:block}
  .tile[aria-pressed="true"] .em{border:2px solid var(--gold);box-shadow:0 0 0 3px var(--g),0 10px 22px rgba(15,61,46,.28)}
  .tile[aria-pressed="true"] span:last-child{color:var(--ink);font-weight:800}

  .pcard{flex:none;width:116px;background:linear-gradient(180deg,#fff 0%,var(--ivory) 100%);border:1.5px solid rgba(184,149,90,.14);border-radius:20px;padding:10px 8px 12px;text-align:center;box-shadow:var(--sh);position:relative;transition:all .15s}
  .pcard img{width:100%;height:84px;object-fit:contain;display:block}
  .pcard .ph0{height:84px;display:grid;place-items:center;font-size:30px}
  .pcard b{display:block;font-size:14px;margin-top:6px;line-height:1.25;word-break:keep-all}
  .pcard i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--g3);margin-top:3px}
  .pcard.dim i{color:#aaa}
  .pcard .ck{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center}
  .pcard[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(180deg,#fff 0%,#f6efe0 100%);box-shadow:0 0 0 1px var(--gold2),0 12px 26px rgba(15,61,46,.14)}
  .pcard[aria-pressed="true"] .ck{background:linear-gradient(150deg,#0b3326,#1d6447);border-color:var(--gold2)}
  .pcard[aria-pressed="true"] .ck::after{content:"";width:6px;height:11px;border:solid var(--gold2);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}

  .badge{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--g2);letter-spacing:0}
  .badge.gray{background:#f0eeea;color:#7a7a72}
  .badge.amber{background:var(--warn);color:var(--warn-ink)}
  .badge.gold{background:var(--goldbg);color:#8a6a33}

  /* 설계 헤더 */
  .plan{background:linear-gradient(150deg,#0f3d2e,#1a5640);color:#fff;border:none;position:relative;overflow:hidden}
  .plan::after{content:"";position:absolute;inset:10px;border:1px solid rgba(216,189,134,.25);border-radius:18px;pointer-events:none}
  .plan h3{font-size:22px;margin:4px 0 2px;color:#fff}
  .plan .meta{color:#b9cfc2;font-size:14px}
  .plan .inputs{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
  .plan input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:1px solid rgba(216,189,134,.35);background:rgba(255,255,255,.08);color:#fff;outline:none}
  .plan input::placeholder{color:#9db7a8}
  .plan .area{flex:0 0 132px;position:relative}
  .plan .area input{width:100%;padding-right:34px}
  .plan .area span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--gold2);font-size:14px}
  .chosen{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative;z-index:1}
  .chosen span{background:rgba(255,255,255,.1);border:1px solid rgba(216,189,134,.35);color:#f3ead8;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
  .farmbox{position:relative;z-index:1;margin-top:14px}
  .fhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--gold2);letter-spacing:.06em;margin-bottom:-6px}
  .fhead button{border:1px solid rgba(216,189,134,.4);background:transparent;color:#e9dfc8;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
  .plan .inputs{margin-top:8px}
  .plan .here{flex:0 0 auto;border:1px solid rgba(216,189,134,.4);background:rgba(255,255,255,.08);color:#f3ead8;border-radius:12px;padding:0 12px;font-size:13px;font-weight:700}
  .staff{margin:8px 0 0;font-size:13px;color:#cfe0d6}
  .staff b{color:var(--gold2)}
  .plant{position:relative;z-index:1;margin-top:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(216,189,134,.3)}
  .plant label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:800;color:var(--gold2)}
  .plant input{flex:0 0 auto;font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid rgba(216,189,134,.45);background:rgba(255,255,255,.1);color:#fff;color-scheme:dark}
  .pchips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .pchips button{border:1px solid rgba(216,189,134,.4);background:transparent;color:#e9dfc8;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
  .pchips button.on{background:linear-gradient(150deg,#c9a86a,#a8844a);color:#fff;border-color:transparent}
  .pnote{margin:8px 0 0;font-size:13px;color:#cfe0d6}
  .pnote b{color:var(--gold2)}
  .mo .dot i{display:block;font-style:normal;font-size:9px;font-weight:700;margin-top:-3px;opacity:.85}
  .mo .dot{flex-direction:column;line-height:1.1}
  .mo .base{display:block;font-size:11px;color:var(--gold);font-weight:700}
  .plan .empty{margin:12px 0 0;color:#cfe0d6;font-size:14px;position:relative;z-index:1}

  .now{background:var(--ivory);border:1px solid var(--gold2)}
  .now .when{margin:0}
  .now h3{font-size:21px;margin:4px 0 8px}
  .now ul{margin:0;padding-left:20px}

  /* 타임라인 */
  .mo{position:relative;padding-left:56px}
  .mo::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:1.5px;background:var(--line)}
  .mo:first-child::before{top:24px}
  .mo:last-child::before{bottom:calc(100% - 24px)}
  .mo > button{width:100%;display:flex;align-items:center;gap:10px;padding:12px 0;background:none;border:none;text-align:left;min-height:52px}
  .mo .dot{position:absolute;left:0;top:6px;width:44px;height:44px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--sub)}
  .mo.now .dot{background:var(--g);border-color:var(--gold2);color:#fff}
  .mo.hit .dot{border-color:var(--g3);color:var(--g2)}
  .mo .s{font-weight:800;flex:1}
  .mo .n{font-size:12px;color:var(--g2);font-weight:800;background:var(--soft);padding:3px 9px;border-radius:999px}
  .mo .body{display:none;padding:0 0 14px}
  .mo.open .body{display:block}
  .mo ul{margin:0 0 6px;padding-left:18px;font-size:15px;color:#3c463f}
  .yr{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.1em;margin:6px 0 2px 56px}
  .pline{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--ivory);padding:10px 12px;margin-top:8px}
  .pline img{width:36px;height:46px;object-fit:contain;flex:none}
  .pline b{font-size:15px}
  .pline span{display:block;font-size:13px;color:var(--sub);line-height:1.45}
  .pline.on{border-color:var(--g3);background:#fff}
  .pline .add{margin-left:auto;flex:none;font-size:12px;font-weight:800;color:var(--g2);border:1px solid var(--g3);border-radius:999px;padding:3px 9px;background:#fff}
  .pline.on .add{background:var(--g);color:var(--gold2);border-color:var(--g)}

  /* 제품 상세 */
  .pd{padding:0;overflow:hidden}
  .pd > summary{list-style:none;display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
  .pd > summary::-webkit-details-marker{display:none}
  .pd > summary img{width:52px;height:66px;object-fit:contain;flex:none}
  .pd > summary .t{flex:1}
  .pd > summary b{font-size:17px;display:block}
  .pd > summary small{color:var(--sub);font-size:13px}
  .pd > summary::after{content:"";width:9px;height:9px;border:solid var(--sub);border-width:0 2px 2px 0;transform:rotate(45deg);margin-right:4px;transition:transform .2s}
  .pd[open] > summary::after{transform:rotate(-135deg)}
  .pd .in{padding:0 18px 18px;border-top:1px solid var(--line)}
  .seg{border-top:1px solid var(--line);margin-top:14px;padding-top:2px}
  .seg:first-child{border-top:none;margin-top:0}
  .kv{display:grid;grid-template-columns:82px 1fr;gap:8px 12px;margin:0}
  .kv dt{font-weight:700;color:var(--sub);font-size:14px;padding-top:1px}
  .kv dd{margin:0}
  .kv dd b{color:var(--g)}
  .warnbox{background:var(--warn);color:var(--warn-ink);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:14px}
  .warnbox ul{margin:4px 0 0;padding-left:18px}
  .warnbox li+li{margin-top:3px}
  .warn{background:var(--warn);color:var(--warn-ink);box-shadow:none;border-color:transparent}
  .danger{background:var(--redbg);color:var(--red);font-weight:700;border-radius:14px;padding:10px 12px;margin-top:12px;font-size:14px}

  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:12px;color:var(--sub);font-weight:700}
  .amt td:first-child{white-space:nowrap;padding-right:12px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

  .calc{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .calc select,.calc input{font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--ivory)}
  .calc input{width:110px}
  .result{margin-top:10px;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:22px;font-weight:800;color:var(--g)}
  .result small{font-size:13px;font-weight:600;color:var(--sub)}

  .issue{border-top:1px solid var(--line);padding:12px 0}
  .issue:first-of-type{border-top:none}
  .issue b{display:block}
  .issue p{margin:4px 0 0;font-size:15px}
  .mini{border:1px solid var(--g3);color:var(--g2);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:800;margin:8px 6px 0 0}
  .bigbtn{display:block;width:100%;margin-top:14px;padding:15px;border-radius:999px;border:none;background:linear-gradient(150deg,#c9a86a,#a8844a);color:#fff;font-weight:800;font-size:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px rgba(168,132,74,.3)}

  /* 하단 */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:15;pointer-events:none}
  .dock .in{max-width:560px;margin:0 auto;padding:0 12px}
  .share{pointer-events:auto;display:flex;gap:8px;margin-bottom:10px}
  .dock .in{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .share button{border:none;border-radius:999px;font-weight:800;font-size:16px;padding:16px;box-shadow:0 12px 28px rgba(15,61,46,.32)}
  .share .primary{flex:1;background:linear-gradient(150deg,#0b3326 0%,#16503a 55%,#1f6a4b 100%);color:#fff;display:flex;justify-content:center;align-items:center;gap:8px;letter-spacing:-.01em;box-shadow:inset 0 0 0 1px rgba(216,189,134,.45),inset 0 1px 0 rgba(255,255,255,.12),0 12px 28px rgba(15,61,46,.35)}
  .share .ghost{border:1px solid rgba(184,149,90,.35) !important}
  .share .primary svg{color:var(--gold2)}
  .share .primary em{font-style:normal;background:var(--gold2);color:var(--g);border-radius:999px;font-size:12px;padding:1px 8px;margin-left:2px}
  .share .ghost{width:54px;background:#fff;color:var(--g);display:grid;place-items:center}
  /* STEP 3 메뉴 — 스크롤하면 위에 붙는다 */
  .menuwrap{position:sticky;top:0;z-index:12;margin:0 -16px;padding:6px 16px 10px;transition:background .2s,box-shadow .2s}
  .menuwrap.stuck{background:rgba(245,242,235,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 24px rgba(15,61,46,.08);padding-top:calc(8px + env(safe-area-inset-top))}
  .menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .menu button{position:relative;border:1px solid rgba(184,149,90,.22);background:linear-gradient(180deg,#fff 0%,var(--ivory) 100%);border-radius:20px;padding:10px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
  .menu button:active{transform:scale(.97)}
  .menu img{width:46px;height:46px;object-fit:contain;transition:all .2s;filter:drop-shadow(0 4px 6px rgba(15,61,46,.15))}
  .menu b{font-size:14px;font-weight:800;letter-spacing:-.02em}
  .menu small{font-size:10.5px;color:var(--sub);font-weight:600;white-space:nowrap}
  .menu button[aria-selected="true"]{background:linear-gradient(160deg,#0b3326,#1a5640);border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(216,189,134,.35),0 12px 26px rgba(15,61,46,.32)}
  .menu button[aria-selected="true"] b{color:#fff}
  .menu button[aria-selected="true"] small{color:var(--gold2)}
  .menu button[aria-selected="true"]::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:3px 3px 0 0;background:var(--gold2)}
  .menuwrap.stuck .menu{gap:6px}

    {keywords:["크게 갉아먹","담배거세미나방"], part:"잎", symptom:"잎이 크게 갉아먹혔어요", label:"담배거세미나방", cause:"담배거세미나방 피해일 수 있어요. 여름~가을 유충이 잎을 크게 갉아먹어요."},
    {keywords:["잎 뒷면 흡즙","진딧물"], part:"잎", symptom:"잎 뒷면에 진딧물이 붙어있어요", label:"진딧물", cause:"복숭아혹진딧물·무테두리진딧물 피해일 수 있어요. 봄·가을 잎 뒷면을 흡즙하고 바이러스를 옮겨요."},
    {keywords:["속이 갈변","속썩음","팁번","잎끝이 갈색","석회결핍"], part:"잎", symptom:"속이 갈변되고 잎끝이 갈색으로 말라요", label:"석회결핍(속썩음)", cause:"석회결핍으로 인한 속썩음(팁번)일 수 있어요. 토양건조나 질소 과다로 칼슘 흡수가 저해될 때 생장점 부근 잎끝이 갈색으로 마르고 결구 속이 갈변돼요.", product:"uninkcal"},
    {keywords:["세포벽이 붕괴","붕소결핍","조직이 물러"], part:"잎", symptom:"잎 조직이 물러지고 생육이 나빠져요", label:"붕소결핍", cause:"붕소결핍일 수 있어요. 붕소가 부족하면 세포벽이 무너져 조직이 물러지고 생육이 나빠져요."},
    {keywords:["검은 깨알","깨씨무늬"], part:"잎", symptom:"잎에 검은 깨알 같은 반점이 생겨요", label:"깨씨무늬", cause:"깨씨무늬(생리적 반점)일 수 있어요. 질소 과다·저온·염류장해로 중륵·잎에 검은 깨알 반점이 생겨요.", product:"impactgranule", companion:"npcalma"},
    {keywords:["속이 안 차","속이 비어","결구불량","속이 꽉 차지 않고 비어있어요","속이 꽉 안"], part:"잎", symptom:"속이 꽉 차지 않고 비어있어요", label:"결구불량", cause:"결구불량일 수 있어요. 배추는 결구기(속이 차는 시기)에 수분을 많이 필요로 하는 호냉성 작물이라, 이 시기에 가물거나 고온이 이어지면 결구가 늦어지고 속이 덜 차요. 정식이 늦어 생육기간이 부족했거나 포기 사이가 너무 밀식된 경우에도 이런 증상이 나타나요. 이건 비료보다 결구기 수분 관리(관수)가 더 중요한 경우가 많아요."}
  ],
  "마늘": [
    {keywords:["쪽이 벌어","통터짐","열구","쪽 벌어지고 갈라져요"], part:"열매", symptom:"마늘통이 쪽쪽 벌어지고 갈라져요", label:"열구(통터짐)", cause:"열구(통터짐)일 수 있어요. 종구를 얕게 심었거나 수확 시기가 늦어져 구 비대기에 영양분이 과도하게 흡수되면 쪽이 벌어지고 갈라져요."},
    {keywords:["한쪽이 유난히 커","크기가 들쭉날쭉","비대가 불균일","통 크기가 포기마다 들쭉날쭉해요"], part:"열매", symptom:"통 크기가 포기마다 들쭉날쭉해요", label:"비대 불균일", cause:"비대 불균일일 수 있어요. 종구 크기가 고르지 않았거나 토양 비옥도가 밭 안에서 차이가 나면, 또는 병해충으로 일부 포기만 생육이 처지면 통 크기가 들쭉날쭉해져요."},
    {keywords:["통이 딱딱하게 굳","마늘통이 딱딱해요"], part:"열매", symptom:"마늘통이 딱딱하게 굳었어요", label:"과숙(수확 지연)", cause:"과숙(수확 지연)일 수 있어요. 수확 적기를 놓치고 계속 밭에 두면 통이 딱딱하게 굳고 저장성도 오히려 떨어질 수 있어요."},
    {keywords:["싹이 두 개","한 자리에서 싹이 여러","쌍구"], part:"뿌리", symptom:"심은 자리에서 싹이 두 개 나와요", label:"쌍구(겹싹)", cause:"쌍구(겹싹)일 수 있어요. 종구를 쪽으로 나누지 않고 겹눈이 있는 통째로 심었거나, 종구 안에 배아가 두 개 있었던 경우 한 자리에서 싹이 여러 개 올라와요."},
    {keywords:["마늘종 끝이 갈라","화경 끝이 갈라"], part:"꽃", symptom:"마늘종 끝이 갈라져요", label:"마늘종 벌어짐(추대)", cause:"마늘종(화경) 끝이 갈라지는 건 추대(꽃눈분화)가 진행되면서 나타나는 자연스러운 생리현상이에요. 꽃이나 주아가 자라면서 양분을 빼앗아가니, 통이 실해지길 원하시면 보이는 대로 일찍 뽑아주시는 게 좋아요."},
    {keywords:["마늘종이 안 올라","화경이 안 나와요"], part:"꽃", symptom:"마늘종이 안 올라와요", label:"추대 지연·품종특성", cause:"아직 추대(마늘종이 올라오는) 시기가 안 됐거나, 한지형 마늘 중 일부 품종은 마늘종이 거의 안 생기는 특성이 있어요. 생육 자체가 부진하다면 양분 부족이나 저온 피해도 살펴보시는 게 좋아요."},
    {keywords:["심은 자리가 비어","결주","발아불량","싹이 안 나"], part:"뿌리", symptom:"심은 자리가 비어있어요", label:"발아불량(결주)", cause:"발아불량(결주)일 수 있어요. 종구가 오래됐거나 심은 깊이가 너무 깊거나 얕으면, 저온다습한 환경까지 겹치면 발아율이 떨어져 드문드문 빈자리가 생겨요."},
    {keywords:["잎끝부터 마름","잎마름병","잎끝부터 말라요"], part:"잎", symptom:"잎끝부터 말라요", label:"잎마름병", cause:"잎마름병일 수 있어요. 4월 하순~수확기 다습한 조건에서 발생해요."},
    {keywords:["인경이 검게","흑색썩음","균핵"], part:"뿌리", symptom:"인경이 검게 썩어요", label:"흑색썩음균핵병", cause:"흑색썩음균핵병일 수 있어요. 2~5월 저온기에 연작지 토양 속 균핵을 통해 전염되며, 인경이 흑색으로 썩고 잎이 아래부터 말라요."},
    {keywords:["잎집이 담갈색","잎집썩음","춘부병"], part:"잎", symptom:"잎집이 담갈색으로 썩어요", label:"잎집썩음병", cause:"잎집썩음병(춘부병)일 수 있어요. 봄철 다습한 조건에서 잎집이 썩어 들어가 줄기·구까지 부패해요."},
    {keywords:["등황색 가루","녹병"], part:"잎", symptom:"잎에 등황색 가루가 생겨요", label:"녹병", cause:"녹병일 수 있어요. 5~6월 저온다습하거나 비료가 부족할 때 발생해요."},
    {keywords:["구가 물러","무름병","냄새","악취"], part:"뿌리", symptom:"구가 물러 썩어요", label:"무름병", cause:"무름병일 수 있어요. 고온이나 과다 비료, 과습 조건에서 지제부부터 물러 썩어요. 조직 내 세포벽이 튼튼하면 병균 침입에 저항력이 생겨요.", product:"sokddanddan", companion:"uninkcal"},
    {keywords:["모자이크","바이러스"], part:"잎", symptom:"잎에 모자이크 무늬가 생겨요", label:"바이러스병", cause:"바이러스병(모자이크병)일 수 있어요. 응애·진딧물이 매개해요."},
    {keywords:["뿌리가 잘려","쉽게 뽑","고자리"], part:"뿌리", symptom:"뿌리가 잘려서 포기가 쉽게 뽑혀요", label:"고자리파리", cause:"고자리파리 피해일 수 있어요. 유충이 뿌리·비늘줄기를 가해해 뿌리가 잘리면서 포기가 쉽게 뽑히고 시들어요."},
    {keywords:["뿌리응애","뿌리 주변이 썩고 아래잎부터 누렇게 변해요"], part:"뿌리", symptom:"뿌리 주변이 썩고 아래잎부터 누렇게 변해요", label:"뿌리응애", cause:"뿌리응애 피해일 수 있어요. 구근 상처·수분 많은 부위에 모여 증식하며, 피해부가 썩고 아래잎부터 누렇게 변해요."},
    {keywords:["구근선충","인경이 물러지고 부패해요"], part:"뿌리", symptom:"인경이 물러지고 부패해요", label:"구근선충", cause:"구근선충 피해일 수 있어요. 인경을 가해해 물러지고 부패해요."},
    {keywords:["파좀나방","파밤나방","잎이 벌레에게 갉아먹혔어요"], part:"잎", symptom:"잎이 벌레에게 갉아먹혔어요", label:"파좀나방·파밤나방", cause:"파좀나방·파밤나방 피해일 수 있어요. 봄~가을 유충이 잎을 가해해요."},
    {keywords:["흰 얼룩","총채벌레"], part:"잎", symptom:"잎에 흰 얼룩이 생겨요", label:"총채벌레", cause:"총채벌레 피해일 수 있어요. 고온건조기에 흡즙해 잎에 흰 얼룩이 생겨요."},
    {keywords:["벌마늘","쪽이 갈라","옆줄기가 터"], part:"열매", symptom:"옆줄기가 터지고 쪽이 여러 개로 갈라져요", label:"벌마늘", cause:"벌마늘(2차생장)일 수 있어요. 겨울·봄철 이상고온과 질소 과다로 옆줄기가 터지고 쪽이 여러 개로 갈라져요."},
    {keywords:["분구가 제대로","스펀지마늘"], part:"열매", symptom:"분구가 제대로 안 되고 통이 부실해요", label:"스펀지마늘", cause:"스펀지마늘일 수 있어요. 과다생육·이상고온으로 분구가 제대로 안 돼 통이 부실해져요."},
    {keywords:["염류장해","비료 과다","비료를 많이 줬는데 생육이 오히려 나빠져요"], part:"뿌리", symptom:"비료를 많이 줬는데 생육이 오히려 나빠져요", label:"염류장해", cause:"염류장해일 수 있어요. 비료를 과다하게 줘서 토양에 염류가 집적되면 생육이 저하돼요."}
  ],
  "양파": [
    {keywords:["모가 연약","모종이 가늘고 약","묘가 약해요"], part:"줄기", symptom:"양파 모가 연약해요", label:"육묘 부실", cause:"육묘 부실일 수 있어요. 파종이 너무 배거나 일조가 부족하고 양분이 부족하면 모가 가늘고 연약하게 자라요. 정식 후 활착도 늦어질 수 있으니 튼튼한 모를 고르는 게 중요해요."},
    {keywords:["수확 후 속이 비어","저장 중 속이 비어"], part:"열매", symptom:"수확 후 속이 비어있어요", label:"공동경(속빔)", cause:"공동경(속이 비는 증상)일 수 있어요. 급속하게 비대했거나 저장 중 수분이 빠지면서 구 속이 비는 경우가 있어요. 질소 과다나 조기수확도 원인이 될 수 있어요."},
    {keywords:["목이 안 여물","목이 두꺼워요","목이 굵어요"], part:"줄기", symptom:"목이 안 여물어요", label:"목 여묾 불량(도복 전 수확)", cause:"목 여묾 불량일 수 있어요. 양파는 잎이 쓰러지는 도복 후 목 부분이 마르며 여무는데, 도복 전에 일찍 수확하면 목이 두껍고 안 여문 상태가 돼요. 도복이 30~50% 진행된 뒤 수확하시는 게 좋아요."},
    {keywords:["껍질이 여러 겹으로 벗겨","겉껍질이 자꾸 벗겨"], part:"열매", symptom:"겉껍질이 여러 겹으로 벗겨져요", label:"겉껍질 탈락", cause:"겉껍질 탈락일 수 있어요. 저장·유통 중 건조되거나 마찰을 받으면 얇은 겉껍질이 여러 겹으로 벗겨져요. 큐어링(수확 후 건조)이 충분했는지도 확인해보시면 좋아요."},
    {keywords:["속에 물이 고여","구 속이 물러지고 물이"], part:"열매", symptom:"구 속에 물이 고여있어요", label:"내부 부패(초기)", cause:"내부 부패(초기 무름병 등)일 수 있어요. 저장 중 고온다습하거나 수확 전 상처가 있으면 구 속에 물이 고이며 무르기 시작해요. 최대한 빨리 골라내 사용하시는 게 좋아요.", product:"sokddanddan", companion:"uninkcal"},
    {keywords:["구 표면에 얼룩","표면에 얼룩이 생겨요"], part:"열매", symptom:"구 표면에 얼룩이 생겨요", label:"표면 얼룩(일소·병반 초기)", cause:"표면 얼룩은 강한 햇볕에 의한 일소이거나, 병반 초기 증상일 수 있어요. 얼룩 부위가 점점 커지거나 물러지면 병일 가능성이 높으니 유심히 지켜봐 주세요."},
    {keywords:["둥글지 않고 길쭉","편평하지 않고 길게 자라"], part:"열매", symptom:"구가 둥글지 않고 길쭉해요", label:"조기추대(구형 이상)", cause:"조기추대로 인한 구형 이상일 수 있어요. 겨울철 이상저온이나 큰 모종을 일찍 정식하면 꽃눈이 일찍 분화되면서 구가 둥글지 않고 길쭉한 편축구 형태로 자라요."},
    {keywords:["수확 후 목 부분이 물러","목부분이 물러져요"], part:"줄기", symptom:"수확 후 목 부분이 물러져요", label:"큐어링 부족", cause:"큐어링(수확 후 건조) 부족일 수 있어요. 수확 직후 충분히 말리지 않고 바로 보관하면 목 부분에 수분이 남아있어 저장 중 물러지기 쉬워요."},

    {keywords:["회백색 곰팡이","노균"], part:"잎", symptom:"잎에 회백색 곰팡이가 생겨요", label:"노균병", cause:"노균병일 수 있어요. 연작지에서 저온다습(3~4월 잦은 비)할 때 발생하고, 잎에 회백색 곰팡이가 생겨요."},

    {keywords:["밀가루 뿌린","흰가루","잎 표면에 흰 곰팡이가 밀가루처럼 덮여요"], part:"잎", symptom:"잎 표면에 흰 곰팡이가 밀가루처럼 덮여요", label:"흰가루병", cause:"흰가루병일 수 있어요. 잎 표면에 흰 곰팡이가 작은 원형으로 생겼다가 점점 퍼져 잎 전체가 밀가루를 뿌린 것처럼 되고, 밤낮 온도차가 크거나 통풍이 안 되는 환경에서 많이 발생해요."},
    {keywords:["다각형 무늬","엽맥을 경계로","노균"], part:"잎", symptom:"잎에 다각형 무늬가 생겨요", label:"노균병", cause:"노균병일 수 있어요. 잎에 부정형의 황색 무늬가 생겼다가 엽맥을 경계로 다각형으로 번지며 갈황색으로 변해요. 20~25℃ 다습 조건에서 통풍·채광이 안 좋을 때 아래 잎부터 발생해요."},
    {keywords:["세로로 찍힌","검은별","흑성병"], part:"잎", symptom:"새잎·열매에 세로로 찍힌 듯한 병반이 생겨요", label:"검은별무늬병(흑성병)", cause:"검은별무늬병(흑성병)일 수 있어요. 새잎·새순·열매에 세로로 찍힌 듯한 병반이 생기고 흑녹색 곰팡이가 나타나며, 저온다습하고 비가 많을 때 빠르게 번져요."},
    {keywords:["줄기가 갈라","분홍색 즙액","부채꼴 병반","덩굴마름병"], part:"줄기", symptom:"줄기가 갈라지며 분홍색 즙액이 나와요", label:"덩굴마름병", cause:"덩굴마름병일 수 있어요. 줄기 접목 부위가 갈라지면서 분홍색 즙액이 나오고 말라 죽으며, 잎에는 가장자리부터 잎맥을 따라 부채꼴 병반이 생겨요."},
    {keywords:["낮에 시들었다 밤에","연작지","뿌리가 갈변","덩굴쪼김병","만할병","낮에 시들었다가 밤에 회복되길 반복해요"], part:"뿌리", symptom:"낮에 시들었다가 밤에 회복되길 반복해요", label:"덩굴쪼김병(만할병)", cause:"덩굴쪼김병(만할병)일 수 있어요. 토양 전염성 병으로 연작지에서 많이 생기고, 처음엔 낮 동안 시들었다가 밤에 회복되길 반복하다 뿌리와 땅가 줄기가 갈변되며 고사해요.", product:"impactgranule"},
    {keywords:["뿌리에 혹","뿌리혹선충"], part:"뿌리", symptom:"뿌리에 혹이 생겨요", label:"뿌리혹선충", cause:"뿌리혹선충 피해일 수 있어요. 뿌리에 혹이 생기면서 양수분 흡수가 나빠져 생육이 부진해지고 시들음 증상이 나타나요."},
    {keywords:["꽃노랑총채벌레","꽃과 어린잎에 흡즙 흔적이 있어요"], part:"꽃", symptom:"꽃과 어린잎에 흡즙 흔적이 있어요", label:"꽃노랑총채벌레", cause:"꽃노랑총채벌레 피해일 수 있어요. 꽃과 어린잎을 흡즙하고 바이러스를 옮기기도 해요."},
    {keywords:["담배가루이","흰 날벌레"], part:"잎", symptom:"잎 뒷면에 흰 날벌레가 있어요", label:"담배가루이", cause:"담배가루이 피해일 수 있어요. 잎 뒷면에서 흡즙하며 그을음병을 유발하고 바이러스를 옮겨요."},
    {keywords:["목화진딧물","잎과 순에 진딧물이 붙어있어요"], part:"잎", symptom:"잎과 순에 진딧물이 붙어있어요", label:"목화진딧물", cause:"목화진딧물 피해일 수 있어요. 잎·순을 흡즙해 생육을 저해하고 그을음병과 바이러스를 함께 옮겨요."},
    {keywords:["점박이응애","흰 반점"], part:"잎", symptom:"잎에 흰 반점이 생겨요", label:"점박이응애", cause:"점박이응애 피해일 수 있어요. 고온건조기에 잎 뒷면을 흡즙해 잎에 흰 반점이 생기고 심하면 잎이 누렇게 말라요."},
    {keywords:["잎에 하얀 선","구불구불한 굴","잎굴파리","잎에 구불구불한 흰 선 자국이 생겨요"], part:"잎", symptom:"잎에 구불구불한 흰 선 자국이 생겨요", label:"아메리카잎굴파리", cause:"아메리카잎굴파리 피해일 수 있어요. 유충이 잎 속에 구불구불한 굴을 파고 다녀 흰 줄무늬 흔적이 남아요."},
    {keywords:["열과","과실이 갈라","과실이 터"], part:"열매", symptom:"과실이 갈라져요", label:"열과", cause:"열과일 수 있어요. 어린 과실일 때는 밤낮 온도차가 클 때, 다 자란 과실일 때는 토양 수분이 갑자기 많아질 때 과실이 갈라져요."},
    {keywords:["발효과","속이 물러","맛이 이상"], part:"열매", symptom:"과실 속이 발효되듯 물러지고 맛이 이상해요", label:"발효과", cause:"발효과일 수 있어요. 생육기 온도·광량·토양수분·질소비료·품종·착과 수 등 여러 조건이 겹쳐서 과실 내부가 발효되듯 변해요."},
    {keywords:["호리병 모양","길쭉하고 납작","비뚤어진","기형과","변형과","과실 모양이 호리병이나 길쭉하게 삐뚤어져요"], part:"열매", symptom:"과실 모양이 호리병이나 길쭉하게 삐뚤어져요", label:"변형과(기형과)", cause:"변형과(기형과)일 수 있어요. 과실이 비정상적으로 자라며 호리병 모양이 되거나 길쭉하고 납작해지는 등 모양이 삐뚤어져요."}
  ],
  "대파": [
    {keywords:["옆으로 쓰러져요","옆으로 넘어져요","포기가 넘어","줄기가 쓰러져요","도복"], part:"줄기", symptom:"포기가 옆으로 쓰러져요", label:"도복(쓰러짐)", cause:"도복(쓰러짐)일 수 있어요. 비바람이나 강한 관수로 줄기가 약해졌거나, 웃자라 줄기가 가늘어졌을 때, 뿌리 활착이 부실할 때 잘 쓰러져요."},
    {keywords:["흰 부분이 짧아","연백부가 짧","대가 짧아","흰 줄기(연백부)가 짧아요"], part:"줄기", symptom:"흰 줄기(연백부)가 짧아요", label:"연백부 발달 부진", cause:"연백부(흰 줄기) 발달 부진일 수 있어요. 북주기가 부족했거나 배게 심어 광이 차단되지 않으면 흰 줄기 부분이 짧게만 자라요."},
    {keywords:["심은 자리가 비어","결주","발아불량","싹이 안 나"], part:"뿌리", symptom:"심은 자리가 비어있어요", label:"발아불량(결주)", cause:"발아불량(결주)일 수 있어요. 씨앗(또는 종구)이 오래됐거나 파종 후 복토가 너무 두껍거나 얇으면, 저온다습한 환경까지 겹치면 발아율이 떨어져 드문드문 빈자리가 생겨요."},
    {keywords:["담자색 타원형","겹무늬","흑반병","검은무늬병"], part:"잎", symptom:"잎에 담자색 타원형 병반이 겹무늬로 생겨요", label:"검은무늬병(흑반병)", cause:"검은무늬병(흑반병)일 수 있어요. 잎에 담자색 타원형 병반이 생겼다가 여러 겹 동심원 무늬로 커지며 검게 변하고, 병반 중앙에는 그을음 같은 검은 포자가 생겨요. 7~8월 비가 잦고 비료가 부족해 후기 생육이 나쁠 때 많이 발생해요."},
    {keywords:["적자색 방추형","잎끝이 흑색","잎끝이 꺾","잎마름병"], part:"잎", symptom:"잎에 적자색 방추형 병반이 생기고 잎끝이 꺾여요", label:"잎마름병", cause:"잎마름병일 수 있어요. 잎에 적자색 방추형 병반이 생겼다가 진전되면 잎끝이 검게 변하며 꺾이고, 병반 위에 검은 곰팡이가 생겨요."},
    {keywords:["잎끝이 말라","끝이 노랗게","끝이 노래","석회결핍","잎끝마름","생리장해"], part:"잎", symptom:"잎끝이 말라요", label:"잎끝마름(생리장해)", cause:"석회결핍이나 가스장해로 인한 잎끝마름일 수 있어요. 토양 수분 과부족이나 pH 저하로 석회 흡수가 나빠지거나, 미숙 퇴비로 인한 암모니아 가스 장해가 원인이 될 수 있어요."},
    {keywords:["회백색 곰팡이","노균"], part:"잎", symptom:"잎에 회백색 곰팡이가 덮여요", label:"노균병", cause:"노균병일 수 있어요. 저온다습한 조건에서 잎에 옅은 병반이 생기고 표면에 회백색 곰팡이가 덮여요."},
    {keywords:["등황색 가루","녹병"], part:"잎", symptom:"잎에 등황색 가루가 생겨요", label:"녹병", cause:"녹병일 수 있어요. 저온다습하거나 비료가 부족할 때 잎에 등황색 가루 같은 포자가 생겨요."},
    {keywords:["신장이 위축","하엽이 처지","오갈병","위축병","새잎이 잘 안 자라고 하엽이 처져요"], part:"잎", symptom:"새잎이 잘 안 자라고 하엽이 처져요", label:"오갈병(위축병)", cause:"오갈병(위축병)일 수 있어요. 새잎의 자람이 위축되고 아래 잎이 처지며 잎끝이 말라요."},
    {keywords:["불규칙한 흰 줄","굴을 파고","파굴파리","밭 전체가 하얗게"], part:"잎", symptom:"잎에 불규칙한 흰 줄무늬가 생겨요", label:"파굴파리", cause:"파굴파리 피해일 수 있어요. 애벌레가 잎 속에 굴을 뚫고 다니면서 불규칙한 흰 줄무늬가 생기고, 심하면 밭 전체가 하얗게 보일 정도로 번져요."},
    {keywords:["파좀나방","파밤나방","잎이 벌레에게 갉아먹혔어요"], part:"잎", symptom:"잎이 벌레에게 갉아먹혔어요", label:"파좀나방·파밤나방", cause:"파좀나방·파밤나방 피해일 수 있어요. 봄~가을 유충이 잎을 갉아먹어요."},
    {keywords:["파총채벌레","흰 얼룩","은색 반점"], part:"잎", symptom:"잎에 흰 얼룩이나 은색 반점이 생겨요", label:"파총채벌레", cause:"파총채벌레 피해일 수 있어요. 고온건조기에 흡즙해 잎에 흰 얼룩이나 은색 반점이 생겨요."},
    {keywords:["엽초가 물러","수침상","연부병","냄새가 고약","무름병","엽초 부위가 물러지고 냄새가 나요"], part:"줄기", symptom:"엽초 부위가 물러지고 냄새가 나요", label:"무름병(연부병)", cause:"무름병(연부병)일 수 있어요. 잎 밑동(엽초)부터 수침상 반점이 생겨 갈색으로 물러 썩으며 위쪽으로 번지고, 심하면 고약한 냄새가 나요. 조직 내 세포벽이 튼튼하면 병균 침입에 저항력이 생겨요.", product:"sokddanddan", companion:"uninkcal"},
    {keywords:["연백부가 물러","흰 줄기 부분이 물러","칼슘결핍","흰 줄기 부분(연백부)이 물러져요"], part:"줄기", symptom:"흰 줄기 부분(연백부)이 물러져요", label:"연백부 칼슘결핍", cause:"연백부 칼슘결핍일 수 있어요. 흰 줄기(연백부)가 비대해지는 시기에 칼슘이 부족하면 조직이 약해지고 무름 증상으로 이어지기 쉬워요.", product:"uninkcal"},
    {keywords:["흑색 균핵","백색 균사","뿌리가 고사","흑색썩음균핵병","뿌리에 흰 균사와 검은 균핵이 생겨요"], part:"뿌리", symptom:"뿌리에 흰 균사와 검은 균핵이 생겨요", label:"흑색썩음균핵병", cause:"흑색썩음균핵병일 수 있어요. 흰 균사가 뿌리와 비늘줄기를 덮으면서 뿌리가 말라 죽고, 겉에 검은 균핵이 생기며 아래 잎부터 갈변돼요."},
    {keywords:["뿌리가 잘려","쉽게 뽑","고자리"], part:"뿌리", symptom:"뿌리가 잘려서 포기가 쉽게 뽑혀요", label:"고자리파리", cause:"고자리파리 피해일 수 있어요. 유충이 뿌리와 비늘줄기를 가해해 뿌리가 잘리면서 포기가 쉽게 뽑히고 시들어요."},
    {keywords:["작은뿌리파리","뿌리 주변에 유충"], part:"뿌리", symptom:"뿌리 주변에 유충이 있어요", label:"작은뿌리파리", cause:"작은뿌리파리 피해일 수 있어요. 유충이 뿌리 주변에서 가해해 뿌리 발육이 나빠지고 생육이 부진해져요."}

function tableRows(c, pr){
  var d = cropDef(c), ns = names(c), out = [];
  pr.g.forEach(function(t){
    t.d.rows.forEach(function(r){
      var label = r[0], toks = label.replace(/\(.*?\)/g, "").split(/[·\s]+/).filter(Boolean), hit;
      if (t.d.perBag){ // 임팩트과립: 6kg은 밭·하우스·과수, 8kg은 수도작 — 작물군으로 줄을 고른다
        var g = d && d.grp;
        var house = d && d.cal && typeof CAL_BASIS !== "undefined" && /시설/.test(CAL_BASIS[d.cal] || ""); // 시설 작형이면 시설 줄만
        hit = g === "화본과" ? /수도작/.test(label) : g === "과수" ? /^과수/.test(label) : house ? /^시설/.test(label) : /^(노지|시설)/.test(label);
      } else {
        hit = ns.some(function(n){ return toks.indexOf(n) >= 0; }) ||
              (d && GRP_TABLE[d.grp] || []).indexOf(label) >= 0 ||
              (d && d.grp === "화본과" && /수도작/.test(label));
      }
      if (hit) out.push({t:t, r:r});
    });
  });
  return out;
}
// 제품 적용작물 문구에 이 작물이 들어가는지
function textFits(c, pr){
  var s = (pr.pj.적용작물 || "") + " " + (pr.pj.사용시기 || "");
  if (!s.trim()) return false;
  var d = cropDef(c);
  if (names(c).some(function(n){ return new RegExp("(^|[\\s·,(/])" + n + "($|[\\s·,)/등])").test(s); })) return true;
  if (ALL_WORDS.some(function(w){ return s.indexOf(w) >= 0; })) return true;
  return !!(d && (GRP_WORDS[d.grp] || []).some(function(w){ return s.indexOf(w) >= 0; }));
}
// 작물-제품 적합도: 3 재배력 권장 / 2 작물별 사용량 있음 / 1 적용작물 표기 / 0 표기 없음
function fit(c, pn){
  var pr = PROD[pn];
  if (calUses(c, pn).length) return 3;
  if (tableRows(c, pr).length) return 2;
  if (textFits(c, pr)) return 1;
  return 0;
}
var FIT_LABEL = ["적용 표기 없음","적용 작물","작물별 사용량","재배력 권장"];
function recommended(c){ return PROD_NAMES.filter(function(n){ return fit(c, n) >= 3; }); }

/* ---------- 상태 ---------- */
// sel: 담은 제품(작물별로 기억), farm 농가명, area 면적(평)
// farm 농가명 · city 시군 · addr 세부주소 — 나중에 농가 DB 로 옮길 칸 (farmRecord() 참고)
var S = {crop:"고추", sel:[], farm:"", city:"", addr:"", area:300, tab:"plan", allCrops:false, allProds:false, open:{}, focus:null, plant:{}};
var SEL_BY_CROP = {};
try {
  var sv = JSON.parse(localStorage.getItem("af-field2") || "{}");
  if (sv.crop && cropDef(sv.crop)) S.crop = sv.crop;
  if (sv.tab) S.tab = sv.tab;
  if (sv.area) S.area = sv.area;
  if (sv.farm) S.farm = sv.farm;
  if (sv.plant) S.plant = sv.plant;
  if (sv.city) S.city = sv.city;
  if (sv.addr) S.addr = sv.addr;
  SEL_BY_CROP = sv.selBy || {};
} catch(e){}
S.sel = (SEL_BY_CROP[S.crop] || []).filter(function(n){ return PROD[n]; });
(function(){
  var q = new URLSearchParams(location.search);
  if (q.get("c") && cropDef(q.get("c"))) { S.crop = q.get("c"); S.sel = []; }
  if (q.get("p")) S.sel = q.get("p").split(",").filter(function(n){ return PROD[n]; });
  if (q.get("t")) S.tab = q.get("t");
})();
if (["plan","use","std","info"].indexOf(S.tab) < 0) S.tab = "plan";
function save(){
  SEL_BY_CROP[S.crop] = S.sel;
  try { localStorage.setItem("af-field2", JSON.stringify({crop:S.crop, tab:S.tab, area:S.area, farm:S.farm, city:S.city, addr:S.addr, plant:S.plant, selBy:SEL_BY_CROP})); } catch(e){}
}
function me(){ try { return JSON.parse(localStorage.getItem("af-me") || "{}"); } catch(e){ return {}; } }
function isSel(n){ return S.sel.indexOf(n) >= 0; }
function toggle(n){ if (isSel(n)) S.sel = S.sel.filter(function(x){ return x !== n; }); else S.sel = S.sel.concat([n]); }

/* ---------- 그리기 도우미 ---------- */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function stripNote(s){ return String(s || "").split(INFO_NOTE).join(""); }
function cropIcon(d){ var u = typeof ICON !== "undefined" && ICON[d.n]; return u ? '<img src="' + u + '" alt="">' : d.e; } // 3D 아이콘, 없으면 이모지
function imgTag(n){ var u = img(n); return u ? '<img src="' + u + '" alt="">' : ""; }
function fmt(v, d){ return (Math.round(v * Math.pow(10, d || 1)) / Math.pow(10, d || 1)).toLocaleString(); }
/* ---------- 농가 정보 (DB 준비) ---------- */
var CITIES = [];   // 상담봇 REGION_CITY_LIST 의 시군 전체
Object.keys(REGION_CITY_LIST).forEach(function(r){ REGION_CITY_LIST[r].forEach(function(c){ if (CITIES.indexOf(c) < 0) CITIES.push(c); }); });
function cityKey(s){ return String(s || "").trim().replace(/(특별시|광역시|특별자치시|시|군|구)$/, ""); }
function regionOf(city){ // 시군 → 담당 지역 (상담봇과 같은 구분)
  var k = cityKey(city); if (!k) return null;
  for (var r in REGION_CITY_LIST) if (REGION_CITY_LIST[r].indexOf(k) >= 0) return r;
  return null;
}
function staffOf(city){ var r = regionOf(city); return r && REGION_STAFF[r] ? {region:r, name:REGION_STAFF[r].name, phone:REGION_STAFF[r].phone} : null; }
// 나중에 농가 DB 로 저장할 한 줄 — 칸 이름을 여기서 정해 둔다
function farmRecord(){
  var a = anchorOf(S.crop), st = staffOf(S.city);
  return {농가명:S.farm, 시군:S.city, 세부주소:S.addr, 담당지역:st ? st.region : "", 작물:S.crop, 면적평:S.area,
          기준일이름:a ? a[2] : "", 기준일:S.plant[S.crop] || "", 제품:S.sel.slice(), 작성일:NOW.toISOString().slice(0, 10)};
}
function farmLabel(){ return S.farm ? S.farm + (/농가|농장|농원|님$/.test(S.farm) ? "" : " 농가") : "농가"; }

function drawHello(){
  var m = me(), W = "일월화수목금토";
  $("hello").innerHTML = m.name ? "안녕하세요, <b>" + esc(m.name) + "</b>님" : "안녕하세요, <b>에이블팜</b>";
  $("today").textContent = NOW.getFullYear() + "년 " + MONTH_NOW + "월 " + NOW.getDate() + "일 " + W[NOW.getDay()] + "요일 · " + MONTH_NOW + "월 " + PART;
  $("meBtn").textContent = m.name ? m.name.trim().charAt(0) : "나";
}

function drawCrops(){
  var list = CROP_DEF.filter(function(d){ return S.allCrops || d.cal || d.n === S.crop; });
  var box = $("crops");
  box.className = "tiles" + (S.allCrops ? " grid" : "");
  box.innerHTML = list.map(function(d){
    return '<button class="tile" type="button" aria-pressed="' + (d.n === S.crop) + '" data-c="' + esc(d.n) + '"><span class="em">' + cropIcon(d) + '</span><span>' + esc(d.n) + '</span></button>';
  }).join("");
  $("cropMore").textContent = S.allCrops ? "접기" : "전체 " + CROP_DEF.length + "종";
  if (!S.allCrops){ var on = box.querySelector('[aria-pressed="true"]'); if (on) box.scrollLeft = on.offsetLeft - 70; }
}

function drawProds(){
  var ranked = PROD_NAMES.map(function(n){ return {n:n, f:fit(S.crop, n)}; })
    .sort(function(a, b){ return (isSel(b.n) - isSel(a.n)) || (b.f - a.f); });
  var shown = ranked.filter(function(x){ return S.allProds || x.f >= 2 || isSel(x.n); });
  if (!shown.length) shown = ranked.filter(function(x){ return x.f >= 1; });
  $("prodTitle").innerHTML = "제품 담기 " + (S.sel.length ? '<span class="badge gold">' + S.sel.length + '개 담음</span>' : "");
  $("prods").innerHTML = shown.map(function(x){
    return '<button class="pcard' + (x.f === 0 ? " dim" : "") + '" type="button" aria-pressed="' + isSel(x.n) + '" data-tg="' + esc(x.n) + '"><span class="ck"></span>' +
      (imgTag(x.n) || '<div class="ph0">🧴</div>') + '<b>' + esc(x.n) + '</b><i>' + FIT_LABEL[x.f] + '</i></button>';
  }).join("");
  $("prodMore").textContent = S.allProds ? "추천만" : "전체 " + PROD_NAMES.length;
  $("addRec").textContent = S.sel.length ? "비우기" : "추천 담기";
}

function drawTabs(){
  [].forEach.call(document.querySelectorAll("#tabs button"), function(b){ b.setAttribute("aria-selected", b.dataset.t === S.tab); });
  $("shareLbl").innerHTML = S.tab === "plan" || S.tab === "use" ? (S.sel.length ? "처방 보내기 <em>" + S.sel.length + "</em>" : "농가에 보내기") : S.tab === "std" ? "시비량 보내기" : "작물정보 보내기";
}

/* ---------- 면적에 맞춘 양 ---------- */
function areaAmounts(pn){ // 이 제품을 S.area 평에 쓸 때의 양 (원본 사용량에 면적 비율만 곱한다)
  var pr = PROD[pn], a = S.area || 300, out = [];
  if (pr.p && pr.p.area){
    var ar = pr.p.area, k = ar.perM2 ? a * M2_PER_PYEONG / ar.perM2 : a / ar.per;
    out.push("관주 1회 " + fmt(ar.L[0] * k) + (ar.L[1] !== ar.L[0] ? "~" + fmt(ar.L[1] * k) : "") + "ℓ");
  }
  tableRows(S.crop, pr).forEach(function(x){
    var t = x.t, r = x.r;
    if (t.d.perBag){
      if (!r[3]) out.push(r[0] + " " + fmt(a / r[2]) + (r[1] !== r[2] ? "~" + fmt(a / r[1]) : "") + "포 (" + t.d.bag + "kg)");
    } else {
      var k2 = a / 300;
      out.push(r[0] + " 총 " + fmt(r[1] * k2) + "~" + fmt(r[2] * k2) + "kg" + (t.d.bag ? " (" + fmt(r[1] * k2 / t.d.bag) + "~" + fmt(r[2] * k2 / t.d.bag) + "포)" : "") +
        (r[3] != null && r[5] ? ", 1회 " + fmt(r[3] * k2) + "~" + fmt(r[4] * k2) + "kg" : ""));
    }
  });
  return out;
}

/* ---------- 설계 ---------- */
// 재배력 12줄을 이 농가의 정식일만큼 옮겨, 지금 시기부터 순서대로 돌려준다 (첫 줄 = 지금)
function orderedRows(c){
  var rows = calRows(c); if (!rows) return [];
  var o = shiftDays(c), today = doy(MONTH_NOW, NOW.getDate());
  return rows.map(function(r){
    var center = doy(r.m, 15) + o;
    // 한 단계는 가운데 날짜 앞뒤 약 15일. 오늘이 그 안에 들면 key 가 가장 작아 맨 앞(지금)이 된다
    return {r:r, sh:shifted(c, r.m), key:(((center - today + 16) % 365) + 365) % 365};
  }).sort(function(a, b){ return a.key - b.key; });
}
function plantBox(){
  var c = S.crop, a = anchorOf(c); if (!a) return "";
  var o = shiftDays(c), md = S.plant[c] || String(a[0]).padStart(2, "0") + "-" + String(a[1]).padStart(2, "0");
  // 날짜 칸의 연도: 두 달 넘게 지난 날짜면 다가오는 작기(내년)로 보여준다 (일정 계산은 월·일만 쓴다)
  var y = NOW.getFullYear() + (doy(+md.slice(0, 2), +md.slice(3, 5)) < doy(MONTH_NOW, NOW.getDate()) - 60 ? 1 : 0);
  var val = y + "-" + md;
  return '<div class="plant"><label>' + a[2] + '<input id="plantDate" type="date" value="' + val + '"></label>' +
    '<div class="pchips"><button type="button" data-shift="0"' + (o === 0 ? ' class="on"' : "") + '>기준 ' + a[0] + '/' + a[1] + '</button>' +
    '<button type="button" data-shift="-14">남부 −2주</button><button type="button" data-shift="-21">제주 −3주</button></div>' +
    '<p class="pnote">' + (o ? "기준보다 <b>" + Math.abs(o) + "일 " + (o > 0 ? "늦게" : "일찍") + "</b> — 아래 일정 전체를 그만큼 옮겼습니다" : "기준 일정입니다. 농가의 " + a[2] + "을 넣으면 일정 전체가 맞춰집니다") + '</p></div>';
}
function staffLine(){
  if (!S.city) return "시군을 넣으면 담당 지역·팀장이 표시됩니다";
  var st = staffOf(S.city);
  return st ? "담당 " + esc(st.region) + " · <b>" + esc(st.name) + "</b> " + esc(st.phone) : "목록에 없는 시군이에요 — 그대로 저장됩니다";
}
function planHeader(){
  var c = S.crop, d = cropDef(c);
  return '<div class="card plan"><div class="eyebrow">Crop Program</div><h3>' + esc(farmLabel()) + ' · ' + esc(c) + ' 처방 설계</h3>' +
    '<div class="meta">' + (d.cal ? esc(d.cal !== c ? d.cal + " 재배력 기준" : (typeof CAL_BASIS !== "undefined" && CAL_BASIS[d.cal]) || "중부 기준") : "월별 재배력 없음") + ' · 지금부터 12개월</div>' +
    '<div class="farmbox"><div class="fhead"><span>농가 정보</span><button type="button" id="newFarm">새 농가</button></div>' +
    '<div class="inputs"><input id="farm" placeholder="농가명 (예: 김영수)" value="' + esc(S.farm) + '"><div class="area"><input id="areaP" type="number" inputmode="numeric" min="1" value="' + S.area + '"><span>평</span></div></div>' +
    '<div class="inputs"><input id="city" list="cityList" placeholder="시군 (예: 성주)" value="' + esc(S.city) + '" autocomplete="off"><button type="button" class="here" id="cityHere">📍 현재 위치</button></div>' +
    '<datalist id="cityList">' + CITIES.map(function(c){ return '<option value="' + esc(c) + '">'; }).join("") + '</datalist>' +
    '<div class="inputs"><input id="addr" placeholder="세부주소 (읍·면·리, 번지)" value="' + esc(S.addr) + '"></div>' +
    '<p class="staff" id="staffLine">' + staffLine() + '</p></div>' +
    plantBox() +
    (S.sel.length ? '<div class="chosen">' + S.sel.map(function(n){ return '<span>' + esc(n) + '</span>'; }).join("") + '</div>'
                  : '<p class="empty">위에서 제품을 담으면 이 농가 맞춤 일정이 만들어집니다. 지금은 ' + esc(c) + ' 추천 제품 전체를 보여줍니다.</p>') + '</div>';
}
function viewPlan(){
  var rows = calRows(S.crop), h = planHeader();
  var filt = S.sel.length ? function(pn){ return isSel(pn); } : function(){ return true; };
  if (!rows){
    var info = CROP_INFO[S.crop];
    h += '<div class="card warn"><b>' + esc(S.crop) + '은(는) 월별 재배력이 아직 없습니다.</b><br>담은 제품의 사용 시기·사용법은 아래와 사용법 탭에서 볼 수 있습니다.' +
      (info && info.시기 ? '<br><br><b>재배 시기</b> ' + esc(stripNote(info.시기)) : "") + '</div>';
  } else {
    var ord = orderedRows(S.crop), moved = shiftDays(S.crop) !== 0;
    var now = ord[0].r, nowP = now.p.filter(function(x){ return filt(prodOf(x[0])); });
    h += '<div class="card now"><div class="eyebrow">This Month · ' + MONTH_NOW + '월 ' + PART + (moved ? ' · 기준 ' + now.m + '월 단계' : "") + '</div><h3>' + esc(now.s) + '</h3><ul>' +
      now.t.map(function(t){ return "<li>" + esc(t) + "</li>"; }).join("") + '</ul>' +
      nowP.map(function(x){ return pline(x, prodOf(x[0])); }).join("") + '</div>';
    h += '<div class="card"><h3>연간 일정 ' + (S.sel.length ? '<span class="badge gold">담은 제품만</span>' : '<span class="badge">추천 전체</span>') + (moved ? '<span class="badge">' + esc(anchorOf(S.crop)[2]) + ' 맞춤</span>' : "") + '</h3><div class="tl">';
    var prevM = 0, yr = NOW.getFullYear();
    ord.forEach(function(o, i){
      var r = o.r, m = r.m, sm = o.sh.m;
      if (i > 0 && sm < prevM){ yr++; h += '<div class="yr">' + yr + '년</div>'; }
      prevM = sm;
      var ps = r.p.filter(function(x){ return filt(prodOf(x[0])); });
      var isNow = i === 0, open = S.open[m] != null ? S.open[m] : (isNow || (S.sel.length > 0 && ps.length > 0));
      h += '<div class="mo' + (isNow ? " now" : "") + (S.sel.length && ps.length ? " hit" : "") + (open ? " open" : "") + '" data-m="' + m + '">' +
        '<span class="dot">' + (moved ? sm + '월<i>' + partOf(o.sh.d) + '</i>' : m + '월') + '</span><button type="button"><span class="s">' + esc(r.s) + (moved ? '<small class="base">기준 ' + m + '월</small>' : "") + '</span>' + (ps.length ? '<span class="n">' + ps.length + '</span>' : "") + '</button>' +
        '<div class="body"><ul>' + r.t.map(function(t){ return "<li>" + esc(t) + "</li>"; }).join("") + '</ul>' +
        ps.map(function(x){ return pline(x, prodOf(x[0])); }).join("") + '</div></div>';
    });
    h += '</div><p class="sub" style="margin:12px 0 0">' + (moved ? "생육 단계와 제품 시기를 " + anchorOf(S.crop)[2] + "에 맞춰 옮겼습니다. 장마·폭염 대비처럼 날씨에 묶인 작업은 실제 날씨에 맞춰 조정하세요."
                                                          : "중부 기준입니다. 남부는 2~3주, 제주는 3~4주 빠릅니다 — 위에서 " + (anchorOf(S.crop) ? anchorOf(S.crop)[2] : "정식일") + "을 바꾸면 일정이 맞춰집니다.") + '</p></div>';
  }
  // 담았지만 재배력에 시기가 없는 제품
  var loose = S.sel.filter(function(n){ return !calUses(S.crop, n).length; });
  if (loose.length){
    h += '<div class="card"><h3>시기를 정해 쓰는 제품</h3><p class="sub" style="margin:-6px 0 4px">이 작물 재배력에는 없는 제품입니다. 제품 기준 시기로 안내하세요.</p>' +
      loose.map(function(n){ var pj = PROD[n].pj, f = fit(S.crop, n);
        return '<button type="button" class="pline on" data-go="' + esc(n) + '">' + imgTag(n) + '<div><b>' + esc(n) + '</b> <span class="badge' + (f ? " gray" : " amber") + '" style="display:inline-block">' + FIT_LABEL[f] + '</span><span>' + esc(pj.사용시기 || pj.한줄설명) + '</span></div></button>';
      }).join("") + '</div>';
  }
  if (S.sel.length){
    var amt = S.sel.map(function(n){ var a = areaAmounts(n); return a.length ? '<tr><td><b>' + esc(n) + '</b></td><td>' + a.map(esc).join("<br>") + '</td></tr>' : ""; }).join("");
    if (amt) h += '<div class="card"><h3>' + fmt(S.area, 0) + '평 기준 필요량</h3><table class="amt">' + amt + '</table><p class="sub" style="margin:8px 0 0">엽면살포 제품은 물 양에 따라 달라 사용법 탭의 「물에 타는 양」으로 계산하세요.</p></div>';
  } else if (rows){
    h += '<button type="button" class="bigbtn" id="addRec2">' + esc(S.crop) + ' 추천 제품 ' + recommended(S.crop).length + '개 한번에 담기</button>';
  }
  return h;
}
function pline(x, pn){
  return '<button type="button" class="pline' + (isSel(pn) ? " on" : "") + '" data-go="' + esc(pn || "") + '">' + imgTag(pn) +

/* ---------- 사용법 ---------- */
function dilutionText(pr){
  if (pr.pj.희석배수) return pr.pj.희석배수;
  if (pr.p) return pr.p.rates.map(function(r){ return r.toLocaleString() + "배"; }).join("~") + (pr.p.foliarOnly ? " (엽면살포)" : "");
  return "";
}
function otherCropOnly(s){ // "벼는 …" 처럼 다른 작물 전용 팁이면 true
  var m = /^([가-힣]+)(은|는)\s/.exec(s), d = m && cropDef(m[1]);
  return !!(d && d.n !== S.crop && !(d.grp === "화본과" && cropDef(S.crop).grp === "화본과"));
}
function cautions(pr){
  var out = [];
  (pr.pj.자주묻는질문 || []).forEach(function(q){ if (/주의/.test(q.질문 || "") && q.답변) out.push(q.답변); });
  if (pr.p && pr.p.tip && !otherCropOnly(pr.p.tip)) out.push(pr.p.tip);
  if (pr.p && pr.p.areaNote) out.push(pr.p.areaNote);
  pr.g.forEach(function(t){ if (!t.d.insoluble && GRAN_TIPS && out.indexOf(GRAN_TIPS) < 0) out.push(GRAN_TIPS); });
  var liquid = pr.p && !pr.g.length;
  if (liquid && !out.some(function(s){ return /혼용|고온/.test(s); }))
    out.push("[공통] 고온기에는 아침·저녁 서늘한 시간에 살포하세요. 다른 농약과 섞을 때는 소면적에 먼저 시험해 보세요.");
  return out;
}
function productDetail(pn, idx){

        (r[6] ? '<dt>시기</dt><dd>' + esc(r[6]) + '</dd>' : "") + '<dt>방법</dt><dd>' + esc(r[7]) + (r[7] === "관주" ? " (물 1톤 이상에 녹여)" : "") + '</dd>';

function drawCalcs(){
  [].forEach.call(document.querySelectorAll(".calc[data-pn]"), function(box){
    var pr = PROD[box.dataset.pn], r = +box.querySelector(".cRate").value, w = +box.querySelector(".cWater").value;

/* ---------- 시비량 (정보) ---------- */
// 값: 숫자 / "12~15"·"2/2/5/10" 같은 글자(수령별·범위) / null(원문에 별도 값 없음)
function n1(v){ return v == null ? "—" : typeof v === "string" ? v : fmt(v); }
function mul(v, k){ return typeof v === "number" ? v * k : null; }
function stdRows(c){ return (STD && STD.작물 && STD.작물[c] || []).filter(function(r){ return r.N != null || r.P != null || r.K != null; }); }

        (r.출처 ? '<p class="sub" style="margin:2px 0 0;font-size:12px">출처: ' + esc(r.출처) + '</p>' : "");
    }).join("") + '</div>' +

}

var REGIONS = [["서울",37.57,126.98],["수원",37.26,127.03],["춘천",37.88,127.73],["강릉",37.75,128.88],["청주",36.64,127.49],["홍성",36.60,126.66],
  ["논산",36.19,127.10],["전주",35.82,127.15],["나주",35.02,126.71],["순천",34.95,127.49],["안동",36.57,128.73],["성주",35.92,128.28],
  ["청송",36.44,129.06],["진주",35.18,128.11],["김해",35.23,128.88],["제주",33.50,126.53]];
var WMO = function(c, day){
  if (c === 0) return [day ? "☀️" : "🌙", "맑음"];
  if (c <= 2) return [day ? "🌤️" : "☁️", "구름 조금"];
  if (c === 3) return ["☁️", "흐림"];
  if (c === 45 || c === 48) return ["🌫️", "안개"];
  if (c >= 51 && c <= 57) return ["🌦️", "이슬비"];
  if (c >= 61 && c <= 67) return ["🌧️", "비"];
  if (c >= 71 && c <= 77) return ["🌨️", "눈"];
  if (c >= 80 && c <= 82) return ["🌦️", "소나기"];
  if (c === 85 || c === 86) return ["🌨️", "눈"];
  if (c >= 95) return ["⛈️", "뇌우"];
  return ["🌡️", ""];
};
var LOC = null;
try { LOC = JSON.parse(localStorage.getItem("af-loc") || "null"); } catch(e){}

function regionPicker(){
  return '<div class="regions"><button type="button" data-gps="1">📍 현재</button>' +

}
function wxFail(msg){
  $("weather").innerHTML = '<div class="eyebrow">Today</div><b>오늘 날씨</b><p class="sub" style="margin:4px 0 0">' + esc(msg) + '</p>' + regionPicker();
}
function setLoc(l){ LOC = l; try { localStorage.setItem("af-loc", JSON.stringify(l)); } catch(e){} loadWeather(); }
function gps(){
  if (!navigator.geolocation){ wxFail("이 기기에서는 위치를 쓸 수 없어요. 지역을 골라 주세요."); return; }
  $("weather").innerHTML = '<p class="sub" style="margin:0">현재 위치를 찾는 중…</p>';
  navigator.geolocation.getCurrentPosition(function(p){
    var la = +p.coords.latitude.toFixed(3), lo = +p.coords.longitude.toFixed(3);
    fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=ko&latitude=" + la + "&longitude=" + lo)
      .then(function(r){ return r.json(); })
      .then(function(g){ setLoc({lat:la, lon:lo, name:[g.city || g.principalSubdivision, g.locality].filter(Boolean).filter(function(v, i, a){ return a.indexOf(v) === i; }).join(" ") || "현재 위치", gps:true}); })
      .catch(function(){ setLoc({lat:la, lon:lo, name:"현재 위치", gps:true}); });
  }, function(){ wxFail("위치 권한이 없어서 지역을 직접 골라 주세요."); }, {timeout:10000, maximumAge:600000});
}
function loadWeather(){
  if (!LOC){ gps(); return; }
  var key = "af-wx-" + LOC.lat + "," + LOC.lon, cached = null;
  try { cached = JSON.parse(localStorage.getItem(key) || "null"); } catch(e){}
  if (cached && Date.now() - cached.t < 20 * 60 * 1000){ drawWeather(cached.d); return; }
  var u = "https://api.open-meteo.com/v1/forecast?latitude=" + LOC.lat + "&longitude=" + LOC.lon +
    "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day" +
    "&hourly=temperature_2m,precipitation_probability,wind_speed_10m,weather_code" +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code" +
    "&wind_speed_unit=ms&timezone=Asia%2FSeoul&forecast_days=2";
  fetch(u).then(function(r){ if (!r.ok) throw 0; return r.json(); }).then(function(d){
    try { localStorage.setItem(key, JSON.stringify({t:Date.now(), d:d})); } catch(e){}
    drawWeather(d);
  }).catch(function(){ cached ? drawWeather(cached.d) : wxFail("날씨를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."); });
}
// 살포 판단: 비 확률 30% 미만 · 바람 4m/s 미만 · 기온 5~29℃ 인 시간이 2시간 이상 이어지면 적기
function sprayAdvice(d){
  var H = d.hourly, now = new Date(), today = H.time[0].slice(0, 10), out = [];
  function idxs(day){ var r = []; H.time.forEach(function(t, i){ var h = +t.slice(11, 13); if (t.slice(0, 10) === day && h >= 5 && h <= 19 && new Date(t) >= new Date(now.getTime() - 3600e3)) r.push(i); }); return r; }
  var list = idxs(today), label = "오늘";
  if (list.length < 3){ list = idxs(d.daily.time[1]); label = "내일"; }
  function ok(i){ return H.precipitation_probability[i] < 30 && H.wind_speed_10m[i] < 4 && H.temperature_2m[i] >= 5 && H.temperature_2m[i] < 30 && H.weather_code[i] < 51; }
  var best = [], run = [];
  list.forEach(function(i){ if (ok(i)){ run.push(i); if (run.length > best.length) best = run.slice(); } else run = []; });
  var rain = list.some(function(i){ return H.precipitation_probability[i] >= 60 || H.weather_code[i] >= 51; });
  var wind = Math.max.apply(null, list.map(function(i){ return H.wind_speed_10m[i]; }));
  var hot = Math.max.apply(null, list.map(function(i){ return H.temperature_2m[i]; }));
  var good = best.length >= 2;
  var msg = good ? label + " " + +H.time[best[0]].slice(11, 13) + "시~" + (+H.time[best[best.length - 1]].slice(11, 13) + 1) + "시 살포하기 좋아요"
                 : rain ? label + " 비 예보 — 엽면살포는 미루세요" : wind >= 4 ? label + " 바람이 강해요 — 살포 시 날림 주의" : hot >= 30 ? label + " 한낮 고온 — 아침·저녁에 살포하세요" : label + " 살포하기 좋은 시간이 짧아요";
  if (good && hot >= 30) out.push("한낮 최고 " + Math.round(hot) + "℃ — 고온 시간대는 피하세요");
  if (good && rain) out.push("다른 시간대에 비 예보가 있어요");
  var tmin = d.daily.temperature_2m_min[1];
  if (tmin <= 3) out.push("내일 아침 최저 " + Math.round(tmin) + "℃ — 서리·저온 피해 주의");
  return {good:good, msg:msg, sub:out.join(" · ")};
}

function productLines(pn, L){
  var pr = PROD[pn], pj = pr.pj, dil = dilutionText(pr);
  L.push("", "◆ " + pn + " — " + pj.한줄설명);
  tableRows(S.crop, pr).forEach(function(x){
    var r = x.r;
    L.push(x.t.d.perBag ? "  · " + r[0] + ": 한 포(" + x.t.d.bag + "kg) " + (r[3] ? "나무 " + r[3] + "그루" : r[1] + "평") + " — " + r[4]
                        : "  · " + r[0] + ": 300평당 " + r[1] + "~" + r[2] + "kg" + (r[3] != null ? " (1회 " + r[3] + "~" + r[4] + "kg)" : "") + (r[6] ? ", " + r[6] : ""));
  });
  if (dil) L.push("  · 희석: " + dil);
  if (!calUses(S.crop, pn).length && pj.사용시기) L.push("  · 시기: " + pj.사용시기);
  if (pj.사용횟수) L.push("  · 횟수: " + pj.사용횟수);
  var a = areaAmounts(pn); if (a.length) L.push("  · " + fmt(S.area, 0) + "평: " + a.join(", "));
  cautions(pr).forEach(function(s){ L.push("  ※ " + s.replace(/^\[공통\]\s*/, "")); });
}
function shareText(){
  var L = [], c = S.crop;
  if ((S.tab === "plan" || S.tab === "use") && S.sel.length){
    var an = anchorOf(c), so = shiftDays(c);
    L.push("[에이블팜] " + farmLabel() + " " + c + " 처방 (" + fmt(S.area, 0) + "평)");
    if (S.city || S.addr) L.push("주소: " + [S.city, S.addr].filter(Boolean).join(" "));
    if (an && so) { var pd = S.plant[c]; L.push(an[2] + " " + (+pd.slice(0, 2)) + "월 " + (+pd.slice(3, 5)) + "일 기준 일정"); }
    if (calRows(c)){
      L.push("", "■ 월별 일정");
      orderedRows(c).forEach(function(o){
        var r = o.r, ps = r.p.filter(function(x){ return isSel(prodOf(x[0])); });
        if (ps.length) L.push(o.sh.label + " " + r.s + ": " + ps.map(function(x){ return x[0] + "(" + x[2] + ")"; }).join(", "));
      });
    }
    L.push("", "■ 제품별 사용법");
    S.sel.forEach(function(pn){ productLines(pn, L); });
  } else if (S.tab === "std" && stdRows(c).length){
    L.push("[에이블팜] " + c + " 표준시비량 (300평당 성분량 kg)");
    stdRows(c).forEach(function(r){ L.push("■ " + (r.작형 || "기본") + ": 질소 " + n1(r.N) + " · 인산 " + n1(r.P) + " · 칼리 " + n1(r.K) + (r.퇴비 ? " · 퇴비 " + r.퇴비 : "")); });
    L.push("", "※ 농촌진흥청 기준. 토양검정 결과가 있으면 처방서가 우선입니다.");
  } else if (S.tab === "info"){
    var info = CROP_INFO[c];
    L.push("[에이블팜] " + c + " 재배 정보");
    if (info) Object.keys(info).forEach(function(k){ L.push("■ " + k + ": " + stripNote(info[k])); });
    if (info) L.push("", "※" + INFO_NOTE);
  } else {
    var rows2 = calRows(c);
    L.push("[에이블팜] " + c + " 재배력 — " + MONTH_NOW + "월");
    if (rows2){
      [MONTH_NOW, MONTH_NOW % 12 + 1].forEach(function(m){
        var r = rows2[m - 1];
        L.push("", "■ " + m + "월 · " + r.s, "할 일: " + r.t.join(", "));
        r.p.forEach(function(x){ L.push("- " + x[0] + ": " + x[1] + " (" + x[2] + ")"); });
      });
    }
  }
  var mm = me(), st = staffOf(S.city);
  // 담당: 내 정보가 있으면 나, 없으면 농가 시군의 지역 팀장
  var who = mm.name || mm.phone ? [mm.name, mm.phone].filter(Boolean).join(" ") : st ? st.name + " " + st.phone : "";
  L.push("", "문의: " + COMPANY + (who ? " / 담당 " + who : ""));
  return L.join("\n");
}
function toast(t){ var e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function(){ e.classList.remove("show"); }, 1800); }
function copy(t){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(function(){ toast("복사했어요. 카톡에 붙여넣으세요"); });
  var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("복사했어요. 카톡에 붙여넣으세요"); } catch(e){ toast("복사가 안 됐어요"); }
  ta.remove();
}

/* ---------- 앱 설치 (PWA) ----------
   안드로이드 크롬: 「앱 설치」 버튼 / 아이폰 사파리: 「공유 → 홈 화면에 추가」 안내
   카카오톡 안 브라우저는 설치가 안 돼서 「브라우저로 열기」 를 띄운다 */
(function(){
  var ua = navigator.userAgent, bar = $("installBar"), prompt = null;
  var standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
    navigator.serviceWorker.register("sw.js").catch(function(){});
  if (standalone) return;
  try { if (localStorage.getItem("af-install-x") === "1") return; } catch(e){}
  function show(html){ bar.innerHTML = html + '<button type="button" class="x" aria-label="닫기">×</button>'; bar.hidden = false; }
  bar.addEventListener("click", function(e){
    if (e.target.classList.contains("x")){ bar.hidden = true; try { localStorage.setItem("af-install-x", "1"); } catch(err){} }
    if (e.target.id === "doInstall" && prompt){ prompt.prompt(); prompt.userChoice.then(function(){ bar.hidden = true; prompt = null; }); }
  });
  if (/KAKAOTALK/i.test(ua)){
    show('<span>카카오톡 안에서는 앱 설치가 안 돼요. 브라우저로 열어 설치하세요.</span><a href="kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href) + '">브라우저로 열기</a>');
    return;
  }
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); prompt = e;
    show('<span>홈 화면에 <b>현장처방</b> 앱으로 설치하면 아이콘으로 바로 열려요.</span><button type="button" class="go" id="doInstall">앱 설치</button>');
  });
  if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1))
    show('<span>아래(아이패드는 위) <b>공유 ⬆</b> 버튼 → <b>「홈 화면에 추가」</b>를 누르면 앱으로 설치돼요.</span>');
  window.addEventListener("appinstalled", function(){ bar.hidden = true; toast("설치했어요. 홈 화면의 현장처방 아이콘으로 여세요"); });
})();
