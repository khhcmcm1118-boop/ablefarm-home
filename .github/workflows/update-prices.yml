name: 농산물 시세 자동 갱신

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 시세 갱신
        env:
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
        run: node scripts/update-prices.mjs
      - name: 변경사항 커밋
        run: |
          git config user.name  "ablefarm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: 농산물 시세 자동 갱신"
          git push
