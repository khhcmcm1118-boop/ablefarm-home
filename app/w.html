<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 폭 확인</title>
<style>
  body{margin:0; padding:22px 18px; background:#0f172a; color:#e2e8f0;
       font-family:-apple-system,"Malgun Gothic",sans-serif; font-size:17px; line-height:1.5}
  h1{font-size:20px; margin:0 0 14px}
  .big{font-size:52px; font-weight:800; margin:6px 0 2px; color:#6ee7b7;
       font-variant-numeric:tabular-nums}
  .tier{font-size:22px; font-weight:800; margin:14px 0 18px; padding:12px 14px;
        border-radius:12px; background:rgba(255,255,255,.08)}
  table{border-collapse:collapse; width:100%; max-width:520px}
  td{padding:6px 4px; border-bottom:1px solid rgba(255,255,255,.12); font-size:15px}
  td:first-child{color:#94a3b8; white-space:nowrap; padding-right:14px}
  .ua{margin-top:14px; font-size:12px; color:#7d8da3; word-break:break-all}
</style>
</head>
<body>
<h1>에이블팜 — 화면 폭 확인</h1>
<div>지금 이 화면의 폭</div>
<div class="big" id="w">-</div>
<div class="tier" id="t">-</div>
<table>
  <tr><td>화면 세로</td><td id="h">-</td></tr>
  <tr><td>기기 화면</td><td id="s">-</td></tr>
  <tr><td>화면 배율</td><td id="d">-</td></tr>
  <tr><td>방향</td><td id="o">-</td></tr>
</table>
<div class="ua" id="ua"></div>
<script>
(function(){
  function draw(){
    var w = window.innerWidth;
    document.getElementById('w').textContent = w + ' px';
    var t = w >= 1000 ? '컴퓨터 배치 (1000px 이상)'
          : w >= 820  ? '태블릿 넓은 배치 (820~999px)'
          : w >= 700  ? '태블릿 배치 (700~999px)'
          : '폰 배치 (700px 미만) ← 여기면 한 줄로 보입니다';
    document.getElementById('t').textContent = t;
    document.getElementById('h').textContent = window.innerHeight + ' px';
    document.getElementById('s').textContent = screen.width + ' × ' + screen.height;
    document.getElementById('d').textContent = (window.devicePixelRatio || 1);
    var o = (screen.orientation && screen.orientation.type) || '-';
    document.getElementById('o').textContent = o;
  }
  draw();
  window.addEventListener('resize', draw);
  window.addEventListener('orientationchange', function(){ setTimeout(draw, 300); });
  document.getElementById('ua').textContent = navigator.userAgent;
})();
</script>
</body>
</html>
