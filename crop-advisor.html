<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에이블팜 작물 고민 상담봇</title>
<style>
  :root{
    --dark-green:#1E5C1E;
    --mid-green:#2E7D32;
    --lime:#7DB82A;
    --cream:#FAF7F0;
    --card:#FFFFFF;
    --ink:#2B2B24;
    --ink-soft:#5B5A4F;
    --line:#E4E0D2;
    --warn-bg:#FDECEA;
    --warn-line:#E9B8B2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Pretendard",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(circle at 15% 8%, rgba(125,184,42,0.10), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(30,92,30,0.08), transparent 40%),
      var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 12px;
  }

  .widget{
    width:100%;
    max-width:460px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 18px 40px -20px rgba(30,92,30,0.35);
    display:flex;
    flex-direction:column;
    height:min(720px, 88vh);
  }

  .header{
    background:var(--dark-green);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .leaf-badge{
    width:38px;height:38px;border-radius:11px;
    background:var(--lime);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    flex-shrink:0;
  }
  .header .titles{line-height:1.3;}
  .header .titles .name{font-size:15px;font-weight:700;letter-spacing:-0.2px;}
  .header .titles .sub{font-size:12px;color:#CFE6CF;margin-top:3px;line-height:1.45;}

  .thread{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:
      linear-gradient(var(--cream), var(--cream));
  }
  .thread::-webkit-scrollbar{width:6px;}
  .thread::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  .row{display:flex;}
  .row.bot{justify-content:flex-start;}
  .row.user{justify-content:flex-end;}

  .bubble{
    max-width:82%;
    padding:11px 14px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:keep-all;
  }
  .bubble.bot{
    background:#EEF6EA;
    border:1px solid #DCEBD3;
    color:var(--ink);
    border-bottom-left-radius:5px;
  }
  .bubble.user{
    background:var(--dark-green);
    color:#fff;
    border-bottom-right-radius:5px;
  }
  .nutrient-hl{
    color:#D32F2F;
    text-decoration:underline;
    font-weight:700;
  }

  .card{
    max-width:88%;
    background:var(--card);
    border:1.5px solid var(--mid-green);
    border-radius:14px;
    padding:14px 16px;
    font-size:14px;
    line-height:1.6;
  }
  .card .badge{
    display:inline-block;
    background:var(--lime);
    color:#1E3A0E;
    font-size:12px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    margin-bottom:8px;
  }
  .card .pname{
    font-size:16.5px;
    font-weight:800;
    color:var(--dark-green);
    margin-bottom:4px;
  }
  .card .row-line{margin:5px 0;}
  .card .label{color:var(--mid-green);font-weight:700;}
  .card .caution{
    margin-top:10px;
    background:var(--warn-bg);
    border:1px solid var(--warn-line);
    border-radius:10px;
    padding:8px 10px;
    font-size:13px;
    color:#8A2E24;
  }

  .contact-card{
    max-width:88%;
    background:#F4F1E8;
    border:1px dashed #B9B49E;
    border-radius:14px;
    padding:12px 14px;
    font-size:13.5px;
    color:var(--ink-soft);
  }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:4px 16px 14px;
    flex-shrink:0;
    background:var(--cream);
  }
  .chip{
    border:1.5px solid var(--mid-green);
    color:var(--mid-green);
    background:#fff;
    padding:9px 13px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, color .15s, transform .1s;
    white-space:nowrap;
  }
  .chip:hover{background:var(--mid-green);color:#fff;}
  .chip:active{transform:scale(0.96);}
  .chip.primary{
    background:var(--dark-green);
    color:#fff;
    border-color:var(--dark-green);
  }
  .chip.primary:hover{background:var(--mid-green);}

  .inputbar{
    display:flex;
    gap:8px;
    padding:12px 14px;
    border-top:1px solid var(--line);
    background:#fff;
    flex-shrink:0;
  }
  .inputbar input{
    flex:1;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:11px 13px;
    font-size:14.5px;
    outline:none;
    font-family:inherit;
  }
  .inputbar input:focus{border-color:var(--mid-green);}
  .inputbar button{
    background:var(--dark-green);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:0 18px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
  }
  .inputbar button:hover{background:var(--mid-green);}

  .typing{
    display:flex;gap:4px;padding:11px 14px;
    background:#EEF6EA;border:1px solid #DCEBD3;border-radius:16px;border-bottom-left-radius:5px;
    width:fit-content;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;background:var(--mid-green);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}

  /* ---------- 캐릭터(에이블 농박사) ---------- */
  .row.bot{gap:8px;}
  .avatar{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:#DDEFC0;border:1.5px solid #fff;
    box-shadow:0 1px 4px rgba(30,92,30,.25);overflow:hidden;
    margin-top:2px;
  }
  .avatar img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .avatar.ghost{visibility:hidden;box-shadow:none;}
  .header{align-items:flex-end;padding:16px 0 0 20px;gap:14px;justify-content:space-between;}
  .header .titles{padding-bottom:18px;min-width:0;}
  .header .titles .name{font-size:19px;}
  .header .titles .hello{
    display:inline-block;margin-top:9px;background:#fff;color:var(--dark-green);
    font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:12px 12px 12px 3px;
  }
  .hero-char{
    position:relative;width:148px;height:148px;flex-shrink:0;
    border-radius:26px 0 0 0;overflow:hidden;background:#DDEFC0;
    border:3px solid #fff;border-right:none;border-bottom:none;
    box-shadow:-6px -4px 18px -8px rgba(0,0,0,.35);
  }
  .hero-char video,.hero-char img{display:block;width:100%;height:100%;object-fit:cover;}
  .hero-char .online{
    position:absolute;left:9px;bottom:9px;display:flex;align-items:center;gap:5px;
    background:rgba(30,92,30,.88);color:#fff;font-size:11px;font-weight:700;
    padding:3px 8px 3px 7px;border-radius:999px;
  }
  .hero-char .online i{width:7px;height:7px;border-radius:50%;background:#7DB82A;display:block;}
  .header .titles .name small{
    font-size:11px;font-weight:600;background:var(--lime);color:#1E3A0E;
    padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;
  }

  /* ---------- 제품 카드 (이미지 + 홍보 + 링크) ---------- */
  .row.bot .card{max-width:calc(88% - 42px);}
  .card .pc-head{display:flex;gap:12px;align-items:center;margin-bottom:6px;}
  .card .pc-img{
    width:62px;height:72px;flex-shrink:0;border-radius:12px;
    background:linear-gradient(160deg,#F1F8E6,#DDEFC0);
    display:flex;align-items:center;justify-content:center;
  }
  .card .pc-img svg{width:52px;height:64px;display:block;}
  .card .pc-title{min-width:0;}
  .card .pc-title .badge{margin-bottom:5px;}
  .card .pc-title .pname{margin-bottom:0;}
  .card .promo{
    margin-top:10px;padding:8px 10px;border-radius:10px;
    background:#F1F8E6;border:1px solid #DCEBD3;
    font-size:13px;color:var(--dark-green);font-weight:600;
  }
  .more-btn{
    display:block;margin-top:10px;text-align:center;text-decoration:none;
    background:var(--dark-green);color:#fff;font-size:13.5px;font-weight:700;
    padding:10px 12px;border-radius:10px;transition:background .15s;
  }
  .more-btn:hover{background:var(--mid-green);}
  .card.mini{padding:12px 14px;}
  .card.mini .more-btn{margin-top:8px;}

  @media (max-width:480px){
    .widget{height:100vh;border-radius:0;max-width:100%;}
    body{padding:0;}
  }

  /* =====================================================================
     스킨: 크림 바탕 + 세이지 그린 + 폰 프레임 (친근한 앱 느낌)
  ===================================================================== */
  :root{
    --sage:#6E8F6C; --sage-d:#4F7355; --bezel:#2E5B43; --sage-l:#E6EEDF;
    --cream:#F7EEDD; --paper:#FCF6E9; --line:#E6D9BF;
    --dark-green:#4F7355; --mid-green:#4F7355; --lime:#C9DDA0;
  }
  body{background:#F3E4CC;background-image:none;padding:20px 12px;}
  .widget{
    max-width:392px;height:min(800px,94vh);
    background:var(--cream);
    border:9px solid var(--bezel);border-radius:46px;
    box-shadow:0 30px 50px -22px rgba(46,91,67,.55), 0 0 0 2px rgba(255,255,255,.35) inset;
    position:relative;
  }
  .notch{
    position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:5;
    width:118px;height:24px;background:var(--bezel);border-radius:0 0 16px 16px;
  }
  .notch::after{content:"";position:absolute;right:20px;top:8px;width:8px;height:8px;border-radius:50%;background:#1D3A2B;}
  .topbar{background:var(--sage);color:#fff;padding:30px 20px 12px;flex-shrink:0;}
  .topbar .name{font-size:16px;font-weight:800;text-align:center;letter-spacing:.3px;}
  .topbar .name small{
    font-size:11px;font-weight:700;background:rgba(255,255,255,.2);color:#fff;
    padding:2px 8px;border-radius:999px;margin-left:7px;vertical-align:1px;
  }
  .hero-char{
    position:relative;width:100%;height:226px;flex-shrink:0;border:none;border-radius:0;
    box-shadow:none;background:#DCE6CC;overflow:hidden;
    transition:height .45s ease;
  }
  .hero-char video,.hero-char img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;}
  .hero-char .online{background:rgba(79,115,85,.92);left:12px;bottom:34px;}
  .band{
    position:relative;z-index:2;flex-shrink:0;
    margin:-26px 12px 0;padding:11px 16px 12px;border-radius:20px;
    background:var(--sage);color:#fff;box-shadow:0 6px 14px -8px rgba(30,60,40,.5);
    transition:margin .45s ease;
  }
  .band-t{font-size:12.5px;line-height:1.5;opacity:.92;word-break:keep-all;}
  .band-s{font-size:14px;font-weight:800;margin-top:4px;}
  .widget.compact .hero-char{height:158px;}
  .widget.compact .hero-char .online{bottom:10px;}
  .widget.compact .hero-char video,.widget.compact .hero-char img{object-position:50% 4%;}
  .widget.compact .band{display:none;}

  .thread{background:var(--cream);padding:16px 14px 8px;}
  .thread::-webkit-scrollbar-thumb{background:#D9C9A8;}
  .bubble{border-radius:18px;}
  .bubble.bot{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 1px 0 rgba(0,0,0,.03);}
  .bubble.user{background:var(--sage);border-bottom-right-radius:5px;}
  .typing{background:var(--paper);border-color:var(--line);}
  .typing span{background:var(--sage);}
  .avatar{border-color:var(--paper);background:var(--sage-l);}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 10px -8px rgba(60,50,20,.5);}
  .card .badge{background:var(--sage-l);color:var(--sage-d);}
  .card .pname{color:var(--sage-d);}
  .card .label{color:var(--sage-d);}
  .card .pc-img{background:linear-gradient(160deg,#F3F7E8,#DCE6CC);}
  .card .promo{background:var(--sage-l);border-color:#D2E0C7;color:var(--sage-d);}
  .more-btn{background:var(--sage);border-radius:999px;}
  .more-btn:hover{background:var(--sage-d);}
  .contact-card{background:#F2E8D3;border-color:#C9B98F;}
  .chips{background:var(--cream);padding:4px 14px 12px;}
  .chip{background:var(--paper);border:1.5px solid var(--sage);color:var(--sage-d);}
  .chip:hover{background:var(--sage);color:#fff;}
  .chip.primary{background:var(--sage);border-color:var(--sage);color:#fff;}
  .chip.primary:hover{background:var(--sage-d);}
  .inputbar{
    margin:0 12px 14px;padding:7px 8px 7px 16px;border:none;border-radius:999px;
    background:var(--sage);align-items:center;gap:8px;
  }
  .inputbar input{background:transparent;border:none;color:#fff;padding:8px 0;}
  .inputbar input::placeholder{color:rgba(255,255,255,.78);}
  .inputbar input:focus{border:none;}
  .inputbar button{background:#fff;color:var(--sage-d);border-radius:999px;padding:9px 16px;}
  .inputbar button:hover{background:var(--sage-l);}

  @media (max-width:480px){
    body{padding:0;background:var(--cream);}
    .widget{height:100vh;height:100dvh;max-width:100%;border:none;border-radius:0;box-shadow:none;}
    .notch{display:none;}
    .topbar{padding-top:14px;}
    .hero-char{height:210px;}
  }

  .card .pc-photo{
    margin:-14px -16px 12px;padding:14px 0 10px;border-radius:18px 18px 0 0;
    background:radial-gradient(ellipse at 50% 85%,#F3F7E8 0%,#DCE6CC 70%);
    display:flex;justify-content:center;
  }
  .card .pc-photo img{height:204px;width:auto;display:block;filter:drop-shadow(0 8px 8px rgba(40,60,30,.28));}
  .card.mini .pc-photo{margin:-12px -14px 10px;}
  .card.mini .pc-photo img{height:176px;}
</style>
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('embed');</script>
<style>
  html.embed body{padding:0 !important;display:block !important;min-height:0 !important;background:#FAF7F0}
  html.embed .widget{max-width:none !important;height:100vh;border:0 !important;border-radius:0 !important;box-shadow:none !important}
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="notch"></div>
  <div class="topbar">
    <div class="name">에이블 농박사<small>작물 상담</small></div>
  </div>
  <div class="hero-char" id="heroChar"><span class="online"><i></i>상담 중</span></div>
  <div class="band">
    <div class="band-t">작물 상태를 말씀해주시면 원인부터, 제품 사용법까지 알려드려요.</div>
    <div class="band-s">무엇이든 편하게 물어보세요! 🌾</div>
  </div>

  <div class="thread" id="thread"></div>
  <div class="chips" id="chips"></div>
  <div class="inputbar">
    <input id="textInput" type="text" placeholder="예) 고추 키우는데 열매가 잘 안커요" />
    <button id="sendBtn">보내기</button>
  </div>
</div>

<script>
/* ------------------------------------------------------------------

   그대로 substring 매칭하면 오탐이 난다. 이런 단어를 먼저 지우고 검사한다. */
const MIL_FALSE_POSITIVES = ["밀양","비밀","친밀","조밀","면밀","은밀","엄밀","치밀","밀접","밀실","밀폐","밀식","밀리미터","밀리"];

  let t = msg;
  MIL_FALSE_POSITIVES.forEach(fp => { t = t.split(fp).join(''); });
  return t;
}

function detectAnyCrop(msg){
  const safeForMil = stripMilFalsePositives(msg);
  for(const c of CROP_LIST){
    const target = (c === "밀") ? safeForMil : msg;
    if(target.includes(c)) return c;
  }
  return null;
}

function matchesKeyword(text, kw){
  if(text.includes(kw)) return true;
  const variants = MATCH_SYNONYMS[kw];
  if(variants) return variants.some(v => text.includes(v));
  return false;
}

  });
});

function detectRegionFromText(msg){
  for(const city in CITY_TO_REGION){
    let idx = msg.indexOf(city);
    while(idx !== -1){
      // 도시명 바로 앞 글자가 한글이면(예: "저장성"의 "장성") 다른 단어에 파묻힌 것으로 보고 건너뛴다
      const prevChar = idx > 0 ? msg[idx - 1] : '';
      const prevCode = prevChar.charCodeAt(0);
      const prevIsHangul = prevCode >= 0xAC00 && prevCode <= 0xD7A3;
      if(!prevIsHangul) return CITY_TO_REGION[city];
      idx = msg.indexOf(city, idx + 1);
    }
  }
  return null;
}

    {keywords:["V자 모양","검은썩음","흑부병"], part:"잎", symptom:"잎맥을 따라 V자 모양으로 검게 썩어요", label:"검은썩음병", cause:"검은썩음병(흑부병)일 수 있어요. 9월 이후 수확기 고온다습한 조건에서 세균으로 발생해요."},

    {keywords:["오갈","바이러스","모자이크"], part:"잎", symptom:"잎이 오글쪼글하고 모자이크 무늬가 생겨요", label:"바이러스병", cause:"바이러스병(모자이크)일 수 있어요. 진딧물이 매개하며, 조기파종 시 심해요."},
    {keywords:["뿌리가 물러 썩","뿌리마름"], part:"뿌리", symptom:"뿌리가 물러 썩어요", label:"뿌리마름병", cause:"뿌리마름병일 수 있어요. 과습이나 조기파종 시 뿌리·중륵이 물러 썩어요."},
    {keywords:["밑동에 흰 곰팡이","균핵병"], part:"뿌리", symptom:"밑동에 흰 곰팡이가 생겨요", label:"균핵병", cause:"균핵병일 수 있어요. 저온다습한 조건에서 밑동에 흰 곰팡이·검은 균핵이 생겨요."},
    {keywords:["잎에 구멍","좀나방","잎에 작은 구멍이 많이 나요"], part:"잎", symptom:"잎에 작은 구멍이 많이 나요", label:"배추좀나방", cause:"배추좀나방 피해일 수 있어요. 봄~가을 내내 유충이 잎을 갉아 구멍을 내고, 약제저항성이 강해 방제가 까다로워요."},
    {keywords:["배추벌레","흰나비"], part:"잎", symptom:"배추벌레가 잎을 갉아먹었어요", label:"배추흰나비", cause:"배추흰나비 피해일 수 있어요. 봄~가을 유충(배추벌레)이 잎을 갉아먹어요."},
    {keywords:["작은 구멍 다수","벼룩잎벌레","잎에 작은 구멍이 다수 생겨요"], part:"잎", symptom:"잎에 작은 구멍이 다수 생겨요", label:"벼룩잎벌레", cause:"벼룩잎벌레 피해일 수 있어요. 봄·가을에 벼룩이 뛴 듯한 작은 구멍이 잎에 다수 생겨요."},
    {keywords:["크게 갉아먹","담배거세미나방"], part:"잎", symptom:"잎이 크게 갉아먹혔어요", label:"담배거세미나방", cause:"담배거세미나방 피해일 수 있어요. 여름~가을 유충이 잎을 크게 갉아먹어요."},
    {keywords:["잎 뒷면 흡즙","진딧물"], part:"잎", symptom:"잎 뒷면에 진딧물이 붙어있어요", label:"진딧물", cause:"복숭아혹진딧물·무테두리진딧물 피해일 수 있어요. 봄·가을 잎 뒷면을 흡즙하고 바이러스를 옮겨요."},
    {keywords:["속이 갈변","속썩음","팁번","잎끝이 갈색","석회결핍"], part:"잎", symptom:"속이 갈변되고 잎끝이 갈색으로 말라요", label:"석회결핍(속썩음)", cause:"석회결핍으로 인한 속썩음(팁번)일 수 있어요. 토양건조나 질소 과다로 칼슘 흡수가 저해될 때 생장점 부근 잎끝이 갈색으로 마르고 결구 속이 갈변돼요.", product:"uninkcal"},
    {keywords:["세포벽이 붕괴","붕소결핍","조직이 물러"], part:"잎", symptom:"잎 조직이 물러지고 생육이 나빠져요", label:"붕소결핍", cause:"붕소결핍일 수 있어요. 붕소가 부족하면 세포벽이 무너져 조직이 물러지고 생육이 나빠져요."},
    {keywords:["검은 깨알","깨씨무늬"], part:"잎", symptom:"잎에 검은 깨알 같은 반점이 생겨요", label:"깨씨무늬", cause:"깨씨무늬(생리적 반점)일 수 있어요. 질소 과다·저온·염류장해로 중륵·잎에 검은 깨알 반점이 생겨요.", product:"impactgranule", companion:"npcalma"},
    {keywords:["속이 안 차","속이 비어","결구불량","속이 꽉 차지 않고 비어있어요","속이 꽉 안"], part:"잎", symptom:"속이 꽉 차지 않고 비어있어요", label:"결구불량", cause:"결구불량일 수 있어요. 배추는 결구기(속이 차는 시기)에 수분을 많이 필요로 하는 호냉성 작물이라, 이 시기에 가물거나 고온이 이어지면 결구가 늦어지고 속이 덜 차요. 정식이 늦어 생육기간이 부족했거나 포기 사이가 너무 밀식된 경우에도 이런 증상이 나타나요. 이건 비료보다 결구기 수분 관리(관수)가 더 중요한 경우가 많아요."}
  ],
  "마늘": [
    {keywords:["쪽이 벌어","통터짐","열구","쪽 벌어지고 갈라져요"], part:"열매", symptom:"마늘통이 쪽쪽 벌어지고 갈라져요", label:"열구(통터짐)", cause:"열구(통터짐)일 수 있어요. 종구를 얕게 심었거나 수확 시기가 늦어져 구 비대기에 영양분이 과도하게 흡수되면 쪽이 벌어지고 갈라져요."},
    {keywords:["한쪽이 유난히 커","크기가 들쭉날쭉","비대가 불균일","통 크기가 포기마다 들쭉날쭉해요"], part:"열매", symptom:"통 크기가 포기마다 들쭉날쭉해요", label:"비대 불균일", cause:"비대 불균일일 수 있어요. 종구 크기가 고르지 않았거나 토양 비옥도가 밭 안에서 차이가 나면, 또는 병해충으로 일부 포기만 생육이 처지면 통 크기가 들쭉날쭉해져요."},
    {keywords:["통이 딱딱하게 굳","마늘통이 딱딱해요"], part:"열매", symptom:"마늘통이 딱딱하게 굳었어요", label:"과숙(수확 지연)", cause:"과숙(수확 지연)일 수 있어요. 수확 적기를 놓치고 계속 밭에 두면 통이 딱딱하게 굳고 저장성도 오히려 떨어질 수 있어요."},
    {keywords:["싹이 두 개","한 자리에서 싹이 여러","쌍구"], part:"뿌리", symptom:"심은 자리에서 싹이 두 개 나와요", label:"쌍구(겹싹)", cause:"쌍구(겹싹)일 수 있어요. 종구를 쪽으로 나누지 않고 겹눈이 있는 통째로 심었거나, 종구 안에 배아가 두 개 있었던 경우 한 자리에서 싹이 여러 개 올라와요."},
    {keywords:["마늘종 끝이 갈라","화경 끝이 갈라"], part:"꽃", symptom:"마늘종 끝이 갈라져요", label:"마늘종 벌어짐(추대)", cause:"마늘종(화경) 끝이 갈라지는 건 추대(꽃눈분화)가 진행되면서 나타나는 자연스러운 생리현상이에요. 꽃이나 주아가 자라면서 양분을 빼앗아가니, 통이 실해지길 원하시면 보이는 대로 일찍 뽑아주시는 게 좋아요."},
    {keywords:["마늘종이 안 올라","화경이 안 나와요"], part:"꽃", symptom:"마늘종이 안 올라와요", label:"추대 지연·품종특성", cause:"아직 추대(마늘종이 올라오는) 시기가 안 됐거나, 한지형 마늘 중 일부 품종은 마늘종이 거의 안 생기는 특성이 있어요. 생육 자체가 부진하다면 양분 부족이나 저온 피해도 살펴보시는 게 좋아요."},
    {keywords:["심은 자리가 비어","결주","발아불량","싹이 안 나"], part:"뿌리", symptom:"심은 자리가 비어있어요", label:"발아불량(결주)", cause:"발아불량(결주)일 수 있어요. 종구가 오래됐거나 심은 깊이가 너무 깊거나 얕으면, 저온다습한 환경까지 겹치면 발아율이 떨어져 드문드문 빈자리가 생겨요."},
    {keywords:["잎끝부터 마름","잎마름병","잎끝부터 말라요"], part:"잎", symptom:"잎끝부터 말라요", label:"잎마름병", cause:"잎마름병일 수 있어요. 4월 하순~수확기 다습한 조건에서 발생해요."},
    {keywords:["인경이 검게","흑색썩음","균핵"], part:"뿌리", symptom:"인경이 검게 썩어요", label:"흑색썩음균핵병", cause:"흑색썩음균핵병일 수 있어요. 2~5월 저온기에 연작지 토양 속 균핵을 통해 전염되며, 인경이 흑색으로 썩고 잎이 아래부터 말라요."},
    {keywords:["잎집이 담갈색","잎집썩음","춘부병"], part:"잎", symptom:"잎집이 담갈색으로 썩어요", label:"잎집썩음병", cause:"잎집썩음병(춘부병)일 수 있어요. 봄철 다습한 조건에서 잎집이 썩어 들어가 줄기·구까지 부패해요."},
    {keywords:["등황색 가루","녹병"], part:"잎", symptom:"잎에 등황색 가루가 생겨요", label:"녹병", cause:"녹병일 수 있어요. 5~6월 저온다습하거나 비료가 부족할 때 발생해요."},
    {keywords:["구가 물러","무름병","냄새","악취"], part:"뿌리", symptom:"구가 물러 썩어요", label:"무름병", cause:"무름병일 수 있어요. 고온이나 과다 비료, 과습 조건에서 지제부부터 물러 썩어요. 조직 내 세포벽이 튼튼하면 병균 침입에 저항력이 생겨요.", product:"sokddanddan", companion:"uninkcal"},
    {keywords:["모자이크","바이러스"], part:"잎", symptom:"잎에 모자이크 무늬가 생겨요", label:"바이러스병", cause:"바이러스병(모자이크병)일 수 있어요. 응애·진딧물이 매개해요."},
    {keywords:["뿌리가 잘려","쉽게 뽑","고자리"], part:"뿌리", symptom:"뿌리가 잘려서 포기가 쉽게 뽑혀요", label:"고자리파리", cause:"고자리파리 피해일 수 있어요. 유충이 뿌리·비늘줄기를 가해해 뿌리가 잘리면서 포기가 쉽게 뽑히고 시들어요."},
    {keywords:["뿌리응애","뿌리 주변이 썩고 아래잎부터 누렇게 변해요"], part:"뿌리", symptom:"뿌리 주변이 썩고 아래잎부터 누렇게 변해요", label:"뿌리응애", cause:"뿌리응애 피해일 수 있어요. 구근 상처·수분 많은 부위에 모여 증식하며, 피해부가 썩고 아래잎부터 누렇게 변해요."},
    {keywords:["구근선충","인경이 물러지고 부패해요"], part:"뿌리", symptom:"인경이 물러지고 부패해요", label:"구근선충", cause:"구근선충 피해일 수 있어요. 인경을 가해해 물러지고 부패해요."},
    {keywords:["파좀나방","파밤나방","잎이 벌레에게 갉아먹혔어요"], part:"잎", symptom:"잎이 벌레에게 갉아먹혔어요", label:"파좀나방·파밤나방", cause:"파좀나방·파밤나방 피해일 수 있어요. 봄~가을 유충이 잎을 가해해요."},
    {keywords:["흰 얼룩","총채벌레"], part:"잎", symptom:"잎에 흰 얼룩이 생겨요", label:"총채벌레", cause:"총채벌레 피해일 수 있어요. 고온건조기에 흡즙해 잎에 흰 얼룩이 생겨요."},
    {keywords:["벌마늘","쪽이 갈라","옆줄기가 터"], part:"열매", symptom:"옆줄기가 터지고 쪽이 여러 개로 갈라져요", label:"벌마늘", cause:"벌마늘(2차생장)일 수 있어요. 겨울·봄철 이상고온과 질소 과다로 옆줄기가 터지고 쪽이 여러 개로 갈라져요."},
    {keywords:["분구가 제대로","스펀지마늘"], part:"열매", symptom:"분구가 제대로 안 되고 통이 부실해요", label:"스펀지마늘", cause:"스펀지마늘일 수 있어요. 과다생육·이상고온으로 분구가 제대로 안 돼 통이 부실해져요."},
    {keywords:["염류장해","비료 과다","비료를 많이 줬는데 생육이 오히려 나빠져요"], part:"뿌리", symptom:"비료를 많이 줬는데 생육이 오히려 나빠져요", label:"염류장해", cause:"염류장해일 수 있어요. 비료를 과다하게 줘서 토양에 염류가 집적되면 생육이 저하돼요."}
  ],
  "양파": [
    {keywords:["모가 연약","모종이 가늘고 약","묘가 약해요"], part:"줄기", symptom:"양파 모가 연약해요", label:"육묘 부실", cause:"육묘 부실일 수 있어요. 파종이 너무 배거나 일조가 부족하고 양분이 부족하면 모가 가늘고 연약하게 자라요. 정식 후 활착도 늦어질 수 있으니 튼튼한 모를 고르는 게 중요해요."},
    {keywords:["수확 후 속이 비어","저장 중 속이 비어"], part:"열매", symptom:"수확 후 속이 비어있어요", label:"공동경(속빔)", cause:"공동경(속이 비는 증상)일 수 있어요. 급속하게 비대했거나 저장 중 수분이 빠지면서 구 속이 비는 경우가 있어요. 질소 과다나 조기수확도 원인이 될 수 있어요."},
    {keywords:["목이 안 여물","목이 두꺼워요","목이 굵어요"], part:"줄기", symptom:"목이 안 여물어요", label:"목 여묾 불량(도복 전 수확)", cause:"목 여묾 불량일 수 있어요. 양파는 잎이 쓰러지는 도복 후 목 부분이 마르며 여무는데, 도복 전에 일찍 수확하면 목이 두껍고 안 여문 상태가 돼요. 도복이 30~50% 진행된 뒤 수확하시는 게 좋아요."},
    {keywords:["껍질이 여러 겹으로 벗겨","겉껍질이 자꾸 벗겨"], part:"열매", symptom:"겉껍질이 여러 겹으로 벗겨져요", label:"겉껍질 탈락", cause:"겉껍질 탈락일 수 있어요. 저장·유통 중 건조되거나 마찰을 받으면 얇은 겉껍질이 여러 겹으로 벗겨져요. 큐어링(수확 후 건조)이 충분했는지도 확인해보시면 좋아요."},
    {keywords:["속에 물이 고여","구 속이 물러지고 물이"], part:"열매", symptom:"구 속에 물이 고여있어요", label:"내부 부패(초기)", cause:"내부 부패(초기 무름병 등)일 수 있어요. 저장 중 고온다습하거나 수확 전 상처가 있으면 구 속에 물이 고이며 무르기 시작해요. 최대한 빨리 골라내 사용하시는 게 좋아요.", product:"sokddanddan", companion:"uninkcal"},
    {keywords:["구 표면에 얼룩","표면에 얼룩이 생겨요"], part:"열매", symptom:"구 표면에 얼룩이 생겨요", label:"표면 얼룩(일소·병반 초기)", cause:"표면 얼룩은 강한 햇볕에 의한 일소이거나, 병반 초기 증상일 수 있어요. 얼룩 부위가 점점 커지거나 물러지면 병일 가능성이 높으니 유심히 지켜봐 주세요."},

  "참외": [
    {keywords:["접목 부위가 이상","접붙인 부위가","접목부위 부풀"], part:"줄기", symptom:"접목 부위가 이상해요", label:"접목 활착 불량", cause:"접목 활착 불량일 수 있어요. 대목(뿌리 쪽)과 접수(줄기 쪽)가 완전히 붙지 못하면 접목 부위가 붓거나 갈라지거나 생육이 불균형해질 수 있어요. 심하면 그 위쪽만 시들 수 있으니 유심히 지켜봐 주세요."},

    {keywords:["낮에 시들었다 밤에","연작지","뿌리가 갈변","덩굴쪼김병","만할병","낮에 시들었다가 밤에 회복되길 반복해요"], part:"뿌리", symptom:"낮에 시들었다가 밤에 회복되길 반복해요", label:"덩굴쪼김병(만할병)", cause:"덩굴쪼김병(만할병)일 수 있어요. 토양 전염성 병으로 연작지에서 많이 생기고, 처음엔 낮 동안 시들었다가 밤에 회복되길 반복하다 뿌리와 땅가 줄기가 갈변되며 고사해요.", product:"impactgranule"},

    {keywords:["발효과","속이 물러","맛이 이상"], part:"열매", symptom:"과실 속이 발효되듯 물러지고 맛이 이상해요", label:"발효과", cause:"발효과일 수 있어요. 생육기 온도·광량·토양수분·질소비료·품종·착과 수 등 여러 조건이 겹쳐서 과실 내부가 발효되듯 변해요."},
    {keywords:["호리병 모양","길쭉하고 납작","비뚤어진","기형과","변형과","과실 모양이 호리병이나 길쭉하게 삐뚤어져요"], part:"열매", symptom:"과실 모양이 호리병이나 길쭉하게 삐뚤어져요", label:"변형과(기형과)", cause:"변형과(기형과)일 수 있어요. 과실이 비정상적으로 자라며 호리병 모양이 되거나 길쭉하고 납작해지는 등 모양이 삐뚤어져요."}

  "대파": [
    {keywords:["옆으로 쓰러져요","옆으로 넘어져요","포기가 넘어","줄기가 쓰러져요","도복"], part:"줄기", symptom:"포기가 옆으로 쓰러져요", label:"도복(쓰러짐)", cause:"도복(쓰러짐)일 수 있어요. 비바람이나 강한 관수로 줄기가 약해졌거나, 웃자라 줄기가 가늘어졌을 때, 뿌리 활착이 부실할 때 잘 쓰러져요."},

    {keywords:["회백색 곰팡이","노균"], part:"잎", symptom:"잎에 회백색 곰팡이가 덮여요", label:"노균병", cause:"노균병일 수 있어요. 저온다습한 조건에서 잎에 옅은 병반이 생기고 표면에 회백색 곰팡이가 덮여요."},
    {keywords:["등황색 가루","녹병"], part:"잎", symptom:"잎에 등황색 가루가 생겨요", label:"녹병", cause:"녹병일 수 있어요. 저온다습하거나 비료가 부족할 때 잎에 등황색 가루 같은 포자가 생겨요."},

/* ------------------------------------------------------------------
   계절/시기 인식 — cause 문장에 이미 적혀있는 "7~8월", "겨울철" 같은
   시기 표현을 읽어서, 지금 계절과 안 맞는 진단(예: 한여름에 냉해)이
   엉뚱하게 1순위로 나오지 않도록 후순위로 미루는 용도.
   ⚠ 시기 표현이 아예 없는 항목은 "계절 무관"으로 보고 그대로 노출한다.
------------------------------------------------------------------- */
const CURRENT_MONTH = new Date().getMonth() + 1;

const SEASON_WORD_MONTHS = {
  "봄철":[3,4,5], "봄":[3,4,5],
  "여름철":[6,7,8], "여름":[6,7,8], "고온기":[6,7,8], "폭염":[7,8],
  "장마기":[6,7], "장마":[6,7],
  "가을철":[9,10,11], "가을":[9,10,11],
  "겨울철":[12,1,2], "겨울":[12,1,2], "월동":[12,1,2], "겨울나기":[12,1,2],
};

// 받침 유무에 따라 조사를 자동으로 골라줌. pair[0]=받침 있을 때(이/을/은), pair[1]=받침 없을 때(가/를/는)
// 한글이 아닌 문자로 끝나면(괄호 등) 안전하게 받침 있는 쪽(pair[0])을 기본값으로 사용
function josa(word, pair){
  const ch = word.charAt(word.length - 1);
  const code = ch.charCodeAt(0);
  if(code < 0xAC00 || code > 0xD7A3) return pair[0];
  const hasBatchim = (code - 0xAC00) % 28 !== 0;
  return hasBatchim ? pair[0] : pair[1];
}

function extractSeasonMonths(causeText){
  const months = new Set();
  const usedRanges = [];

  // "7~8월", "2~3월" 같은 범위 표현 (온도 범위 "20~25℃" 등은 뒤에 "월"이 없어 제외됨)
  const rangeRe = /(\d{1,2})\s*[~\-–]\s*(\d{1,2})\s*월/g;
  let m;
  while((m = rangeRe.exec(causeText))){
    const a = parseInt(m[1],10), b = parseInt(m[2],10);
    if(a>=1 && a<=12 && b>=1 && b<=12){
      usedRanges.push([m.index, m.index + m[0].length]);
      if(a<=b){ for(let x=a;x<=b;x++) months.add(x); }
      else { for(let x=a;x<=12;x++) months.add(x); for(let x=1;x<=b;x++) months.add(x); }
    }
  }

  // 범위로 이미 처리되지 않은 단일 월 표현 ("9월 이후" 등)
  const singleRe = /(\d{1,2})\s*월/g;
  while((m = singleRe.exec(causeText))){
    const overlap = usedRanges.some(([s,e]) => m.index>=s && m.index<e);
    if(overlap) continue;
    const v = parseInt(m[1],10);
    if(v>=1 && v<=12) months.add(v);
  }

  // 계절을 가리키는 단어 표현
  Object.keys(SEASON_WORD_MONTHS).forEach(w=>{
    if(causeText.includes(w)) SEASON_WORD_MONTHS[w].forEach(mm=>months.add(mm));
  });

  return months; // 비어있으면 "시기 정보 없음" = 계절 무관
}

// monthsSet이 비어있으면(시기 정보 없음) 항상 true. 있으면 현재월 ±1개월까지 허용.
function seasonFits(monthsSet, currentMonth){
  if(!monthsSet || monthsSet.size === 0) return true;
  if(monthsSet.has(currentMonth)) return true;
  const prev = currentMonth===1 ? 12 : currentMonth-1;
  const next = currentMonth===12 ? 1 : currentMonth+1;
  return monthsSet.has(prev) || monthsSet.has(next);
}

function findCropSpecificIssue(msg){
  if(!currentCrop || !CROP_ISSUE_DB[currentCrop]) return null;

  const candidates = CROP_ISSUE_DB[currentCrop]
    .filter(issue => issue.keywords.some(k => matchesKeyword(msg, k)))
    .map(issue => ({
      issue,
      fits: seasonFits(extractSeasonMonths(issue.cause), CURRENT_MONTH),
      matchCount: issue.keywords.filter(k => matchesKeyword(msg, k)).length
    }));

  if(candidates.length === 0) return null;

  // 계절이 맞는 후보를 우선하고, 그 다음은 키워드 일치 개수로 정렬
  candidates.sort((a,b)=>{
    if(a.fits !== b.fits) return a.fits ? -1 : 1;
    return b.matchCount - a.matchCount;
  });

  const top = candidates[0];
  return { ...top.issue, seasonMismatch: !top.fits };
}

function getCropIssuesByPart(crop, part){
  if(!CROP_ISSUE_DB[crop]) return [];
  return CROP_ISSUE_DB[crop].filter(i => i.part === part);
}

// 대화 도중 다른 작물명이 "짧고 명확하게" 입력되거나(예: "사과"),
// 문장이 길어도 "알려줘·궁금해" 같은 요청 표현이 함께 있으면(예: "고추는 어떻게 키우는지 궁금해요")
// 의도적인 전환으로 보고 넘어간다. 반면 "가지 껍질에서 알코올 냄새가 나요"처럼 요청 표현 없이
// 증상만 서술한 문장 속에 우연히 작물명이 섞인 경우는 전환하지 않는다.
const CROP_SWITCH_REQUEST_PATTERNS = ["알려줘","알려주세요","궁금해","궁금합니다","궁금한데","물어볼게요","여쭤볼게요","여쭤봐도","질문 있어요","질문있어요","추천해주세요","추천해줘","설명해줘","설명해주세요","정보 좀","알고 싶어요","알고싶어요"];
function looksLikeExplicitCropSwitch(msg, cropFound){
  const trimmed = msg.trim();
  if(trimmed === cropFound || trimmed.length <= cropFound.length + 4) return true;
  return CROP_SWITCH_REQUEST_PATTERNS.some(p => msg.includes(p));
}

/* ------------------------------------------------------------------
   구체적인 특징 단어 없이 너무 일반적인 표현("잎이 갉아먹혔어요" 등)이라
   증상 매칭이 실패했을 때, 문맥에서 부위(잎/뿌리/줄기/꽃)만이라도 파악되면
   "다시 설명해주세요"로 되묻는 대신 바로 그 부위의 증상 예시를 보여준다.
   ⚠ 여러 부위 단어가 같이 나오면(예: "잎이랑 뿌리가") 우선순위상 먼저
   언급된 것부터 확인하되, "꽃"처럼 구체적인 단어를 우선한다.
------------------------------------------------------------------- */
function inferPartFromText(msg){
  const candidates = [
    {part:"꽃", words:["꽃"]},
    {part:"뿌리", words:["뿌리"]},
    {part:"줄기", words:["줄기","가지","대가","엽초","연백부"]},
    {part:"열매", words:["열매","과실","꼬투리","이삭","고추"]},
    {part:"잎", words:["잎"]},
  ];
  for(const c of candidates){
    if(c.words.some(w => msg.includes(w))) return c.part;
  }
  return null;
}

const CROP_LIST_QUESTION_PATTERNS = ["어떤 작물","무슨 작물","작물 목록","작물 리스트","가능한 작물","지원하는 작물","지원되는 작물","다루는 작물","상담 가능한 작물","작물이 뭐가","작물 뭐가","어떤 걸 물어볼 수","어떤 작물이","다른 작물도","다른 작물은"];
function isCropListQuestion(msg){ return CROP_LIST_QUESTION_PATTERNS.some(p => msg.includes(p)); }

function getSupportedCropsMessage(){
  return `지금 답변드릴 수 있는 작물은 이렇게 있어요.\n\n${SUPPORTED_CROPS.join(", ")}\n\n이 중 작물명을 말씀해주시면 바로 도와드릴게요!`;
}

function getTopIssues(crop){
  const labels = TOP_ISSUES[crop];
  if(!labels || !CROP_ISSUE_DB[crop]) return [];
  const byLabel = {};
  CROP_ISSUE_DB[crop].forEach(i => { byLabel[i.label] = i; });
  return labels.map(l => byLabel[l]).filter(Boolean);
}

const FUNCTION_REQUEST_PATTERNS = [
  {words:["세포벽 강화","세포벽을 강화"], key:"sokddanddan"},
  {words:["칼슘 보충","칼슘을 보충","칼슘 결핍"], key:"uninkcal"},
  {words:["당도를 높이","당도 높이는","단맛을 높이"], key:"hisugar"},
  {words:["뿌리 활착","뿌리를 활착","뿌리 발달"], key:"impactone"},
];
function detectFunctionRequest(msg){
  if(!(msg.includes("제품") || msg.includes("뭐가 있") || msg.includes("있나요") || msg.includes("추천"))) return null;
  for(const f of FUNCTION_REQUEST_PATTERNS){
    if(f.words.some(w => msg.includes(w))) return f.key;
  }
  return null;
}

// 벼 전용 — 생육 단계별 제품 라우팅. 병해충 진단이 아니라 재배 단계에 맞는 제품을 바로 안내한다.
const RICE_STAGE_ROUTES = [
  {words:["육묘","못자리","모판","파종상","볍씨","모 키우","모가 약해","상자육묘"], keys:["himiup","impactgranule"],
   intro:"육묘 관련 질문이시군요."},
  {words:["개화","꽃이 피","이삭이 패","출수","꽃가루","수정이"], keys:["impactone"],
   intro:"개화 관련 질문이시군요."},
  {words:["분얼","새끼치기","포기가 늘어","줄기 수가"], keys:["impactone"],
   intro:"분얼 관련 질문이시군요."},
  {strongWords:["조기수확","숙기 단축","수확을 앞당기"], words:["숙기","추수","수확"], requireAlso:["당기","앞당기","단축","빨리","앞으로"], keys:["finalsolution"],
   intro:"숙기(추수 시기) 관련 질문이시군요."},
];
function detectRiceStageRoute(msg){
  // 한 문장에 "벼"와 단계(육묘·개화 등)가 같이 오는 경우도 잡는다 (제품명 "벼밀콩애"의 "벼"는 제외)
  const mentionsRice = /벼|이앙|못자리|모판|볍씨|수도작/.test(msg.replace(/벼밀콩애/g, ""));
  if(currentCrop !== "벼" && !mentionsRice) return null;
  for(const r of RICE_STAGE_ROUTES){
    if(r.strongWords && r.strongWords.some(w => msg.includes(w))) return r;
    if(!r.words.some(w => msg.includes(w))) continue;
    if(r.requireAlso && !r.requireAlso.some(w => msg.includes(w))) continue;
    return r;
  }
  return null;
}

function isTimingQuestion(msg){ return TIMING_PATTERNS.some(p => msg.includes(p)); }
function isSpacingQuestion(msg){ return SPACING_PATTERNS.some(p => msg.includes(p)); }
function isHarvestInfoQuestion(msg){ return HARVEST_INFO_PATTERNS.some(p => msg.includes(p)); }
function isStorageQuestion(msg){ return STORAGE_PATTERNS.some(p => msg.includes(p)); }
function isPriceQuestion(msg){ return PRICE_PATTERNS.some(p => msg.includes(p)); }
function isCertQuestion(msg){ return CERT_PATTERNS.some(p => msg.includes(p)); }

function tryAnswerCropInfo(msg){
  if(!currentCrop || !CROP_INFO[currentCrop]) return false;
  const info = CROP_INFO[currentCrop];
  if(isStorageQuestion(msg)){ showTyping(()=>{ addBubble(info.저장, 'bot'); setChips(followUpChips()); }); return true; }
  if(isHarvestInfoQuestion(msg)){ showTyping(()=>{ addBubble(info.수확, 'bot'); setChips(followUpChips()); }); return true; }
  if(isSpacingQuestion(msg)){ showTyping(()=>{ addBubble(info.간격, 'bot'); setChips(followUpChips()); }); return true; }
  if(isTimingQuestion(msg)){ showTyping(()=>{ addBubble(info.시기, 'bot'); setChips(followUpChips()); }); return true; }
  return false;
}

function makeAvatar(ghost){
  const a = document.createElement('div');
  a.className = 'avatar' + (ghost ? ' ghost' : '');
  if(!ghost) a.innerHTML = '<img src="' + CHAR_FACE + '" alt="">';
  return a;
}

// 헤더의 큰 캐릭터: 움직이는 영상(모션 줄이기 설정이면 정지 이미지)
function mountHeroCharacter(){
  const box = document.getElementById('heroChar');
  if(!box) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let node;
  if(reduce || typeof Blob === 'undefined' || typeof atob === 'undefined'){
    node = document.createElement('img'); node.src = CHAR_POSTER; node.alt = '에이블 농박사';
  } else {
    try{
      const probe = document.createElement('video');
      const useWebm = probe.canPlayType && probe.canPlayType('video/webm; codecs="vp9"') === 'probably';
      const bin = atob(useWebm ? CHAR_WEBM_B64 : CHAR_VIDEO_B64), arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      node = document.createElement('video');
      node.src = URL.createObjectURL(new Blob([arr], {type:useWebm ? 'video/webm' : 'video/mp4'}));
      node.poster = CHAR_POSTER;
      node.muted = true; node.loop = true; node.autoplay = true; node.playsInline = true;
      node.setAttribute('muted',''); node.setAttribute('playsinline','');
      node.setAttribute('aria-label','에이블 농박사');
      node.addEventListener('canplay', ()=>{ const p = node.play(); if(p && p.catch) p.catch(()=>{}); });
    }catch(err){
      node = document.createElement('img'); node.src = CHAR_POSTER; node.alt = '에이블 농박사';
    }
  }
  box.insertBefore(node, box.firstChild);
}

// 연속된 봇 말풍선에서는 첫 줄에만 얼굴을 보여주고, 나머지는 같은 폭의 빈 자리로 맞춘다
function lastRowIsBot(){
  const last = thread.lastElementChild || thread.children[thread.children.length - 1];
  return !!(last && String(last.className).indexOf('bot') >= 0);
}
function newBotRow(){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.appendChild(makeAvatar(lastRowIsBot()));
  return row;
}

function compactHero(){
  const w = document.getElementById && document.getElementById('widget');
  if(w && w.classList) w.classList.add('compact');
}

function addBubble(text, who){
  if(who === 'user') compactHero();
  const row = (who === 'bot') ? newBotRow() : document.createElement('div');
  if(who !== 'bot') row.className = 'row ' + who;
  const b = document.createElement('div');
  b.className = 'bubble ' + who;
  b.textContent = text;
  row.appendChild(b);
  thread.appendChild(row);
  scrollBottom();
}

// addBubble과 동일하지만 innerHTML로 렌더링한다 — 영양분 이름을 색/밑줄로 강조할 때 사용.
// html은 항상 escapeHtml()로 이스케이프한 문자열에 강조 span만 끼워넣은 것이라 안전하다.
function addBubbleHTML(html, who){
  if(who === 'user') compactHero();
  const row = (who === 'bot') ? newBotRow() : document.createElement('div');
  if(who !== 'bot') row.className = 'row ' + who;
  const b = document.createElement('div');
  b.className = 'bubble ' + who;
  b.innerHTML = html;
  row.appendChild(b);
  thread.appendChild(row);
  scrollBottom();
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

// 영양분 이름을 빨간색+밑줄로 강조한 span으로 감싼다 (텍스트는 escape 처리됨)
function highlightNutrient(nutrient){
  return `<span class="nutrient-hl">${escapeHtml(nutrient)}</span>`;
}

const HOMEPAGE_URL = "https://www.ablefarm.co.kr";
const PRODUCT_SHAPE = { impactgranule:"bag", hygrowergold:"bag", impactgold5L:"jug" };

function productVisual(key, name){
  const shape = PRODUCT_SHAPE[key] || "bottle";
  const clean = String(name).replace(/\(.*?\)/g, "").trim();
  const chars = Array.from(clean);
  const half = chars.length >= 5 ? Math.ceil(chars.length / 2) : chars.length;
  const lines = chars.length >= 5 ? [chars.slice(0, half).join(""), chars.slice(half).join("")] : [clean];
  const fs = Math.max(4.6, Math.min(9, 27 / Math.max(half, 1)));
  const labelY = shape === "bag" ? 24 : 26;
  const textY = lines.length === 2 ? [labelY + 13, labelY + 13 + fs + 1] : [labelY + 17];
  const label = `
    <rect x="13" y="${labelY}" width="34" height="32" rx="4" fill="#1E5C1E"/>
    <rect x="13" y="${labelY}" width="34" height="5" rx="2" fill="#7DB82A"/>
    ${lines.map((t,i)=>`<text x="30" y="${textY[i]}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#fff" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif">${escapeHtml(t)}</text>`).join("")}
    <text x="30" y="${labelY + 29}" text-anchor="middle" font-size="3.8" font-weight="700" fill="#CFE6CF" font-family="Pretendard,'Malgun Gothic',sans-serif">Able FARM</text>`;
  let body;
  if(shape === "bag"){
    body = `<path d="M9 8 L13 4 L17 8 L21 4 L25 8 L29 4 L33 8 L37 4 L41 8 L45 4 L49 8 L51 12 L52 66 Q30 71 8 66 L9 12Z" fill="#fff" stroke="#2E7D32" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M8.5 56 Q30 61 51.5 56 L52 66 Q30 71 8 66Z" fill="#CFE8A8"/>`;
  } else if(shape === "jug"){
    body = `<rect x="22" y="2" width="16" height="7" rx="2" fill="#1E5C1E"/>
      <path d="M12 16 Q12 10 18 10 L42 10 Q48 10 48 16 L50 62 Q50 69 43 69 L17 69 Q10 69 10 62Z" fill="#fff" stroke="#2E7D32" stroke-width="1.5"/>
      <path d="M12 50 L48 50 L50 62 Q50 69 43 69 L17 69 Q10 69 10 62Z" fill="#CFE8A8"/>
      <path d="M44 14 Q54 14 54 22 L54 30 Q54 34 49 34" fill="none" stroke="#2E7D32" stroke-width="1.6"/>`;
  } else {
    body = `<rect x="22" y="2" width="16" height="8" rx="2" fill="#1E5C1E"/>
      <rect x="24" y="10" width="12" height="6" fill="#E9EFE3" stroke="#2E7D32" stroke-width="1"/>
      <path d="M10 24 Q10 16 18 16 L42 16 Q50 16 50 24 L50 62 Q50 69 43 69 L17 69 Q10 69 10 62Z" fill="#fff" stroke="#2E7D32" stroke-width="1.5"/>
      <path d="M10 50 L50 50 L50 62 Q50 69 43 69 L17 69 Q10 69 10 62Z" fill="#CFE8A8"/>`;
  }
  return `<svg viewBox="0 0 60 72" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${body}${label}</svg>`;
}

function productKeyOf(product){
  return Object.keys(PRODUCTS).find(k => PRODUCTS[k] === product) || null;
}
function productDisplayName(key){
  if(PRODUCTS[key]) return PRODUCTS[key].name;
  const hit = (typeof PRODUCT_ALIASES !== 'undefined') ? PRODUCT_ALIASES.find(a => a[1] === key) : null;
  return hit ? hit[0] : key;
}

function photoBlock(key, name){
  const src = PRODUCT_PHOTOS[key];
  return src ? `<div class="pc-photo"><img src="${src}" alt="${escapeHtml(name)}"></div>` : '';
}

function addCard(product, reasonNote){
  const row = newBotRow();
  const c = document.createElement('div');
  c.className = 'card';
  const key = productKeyOf(product);
  c.innerHTML = `
    ${photoBlock(key, product.name)}
    <div class="pc-head">
      ${PRODUCT_PHOTOS[key] ? '' : `<div class="pc-img">${productVisual(key, product.name)}</div>`}
      <div class="pc-title">
        <div class="badge">${product.tag}</div>
        <div class="pname">${product.name}</div>
      </div>
    </div>
    <div class="row-line"><span class="label">효과 · </span>${product.effect}</div>
    <div class="row-line"><span class="label">사용법 · </span>${product.usage}</div>
    <div class="row-line"><span class="label">적용 시기 · </span>${product.timing}</div>
    <div class="caution">⚠ ${product.caution}</div>
    <div class="promo">🌾 농박사 추천 · ${product.name} — ${product.tag}</div>
    <a class="more-btn" href="${HOMEPAGE_URL}" target="_blank" rel="noopener">${product.name} 자세히 보기 ↗</a>
  `;
  row.appendChild(c);
  thread.appendChild(row);
  scrollBottom();
}

function addStaffCard(region){
  const staff = REGION_STAFF[region];
  const row = newBotRow();
  const c = document.createElement('div');

/* ------------------------------------------------------------------
   증상 매칭 엔진
------------------------------------------------------------------- */
function detectCrop(msg){
  const safeForMil = stripMilFalsePositives(msg);
  for(const c of RESTRICTED_CROPS){
    const target = (c === "밀") ? safeForMil : msg;
    if(target.includes(c)) return c;
  }
  return null;
}

function matchProducts(msg){
  const safeMsg = stripMilFalsePositives(msg); // "밀양" 등 오탐 단어 제거한 버전
  const safeBburiMsg = stripBburiFalsePositives(msg); // "뿌리나요" 등 "뿌리다" 활용형 제거한 버전

  const scores = {};
  for(const key in PRODUCTS){
    let score = 0;
    PRODUCTS[key].keywords.forEach(kw=>{
      const target = (kw === "밀") ? safeMsg : (kw === "뿌리") ? safeBburiMsg : msg;
      if(matchesKeyword(target, kw)) score += 1;
    });
    scores[key] = score;
  }

  const restrictedCropInMsg = detectCrop(msg);
  const otherScoreSum = Object.keys(scores)
    .filter(k => k !== CROP_RESTRICTED_KEY)
    .reduce((sum,k)=> sum + scores[k], 0);

  if(restrictedCropInMsg){
    if(otherScoreSum === 0){
      // 구체적인 증상 언급이 없을 때만 "벼/밀/콩이니까 벼밀콩애" 로 안내
      scores[CROP_RESTRICTED_KEY] += 2;
    }
    // 다른 구체적 증상(뿌리, 스트레스, 당도 등)이 있으면 그 증상에 맞는 제품이 우선한다
  } else if(currentCrop && !RESTRICTED_CROPS.includes(currentCrop)){
    scores[CROP_RESTRICTED_KEY] = 0; // 이미 다른 작물이라고 밝혔으면 제외
  }

  const ranked = Object.entries(scores)
    .filter(([k,v]) => v > 0)
    .sort((a,b)=> b[1]-a[1]);

  return ranked;
}

      addBubble("세력이 약해지셨다면 임팩트골드 5리터(관주용)를 추천드려요. 수세 회복이 빠르고 세력 유지에 도움이 되는 제품이에요. 혹시 뿌리 활착이 잘 안 되는 상황이신가요, 아니면 전체적으로 포기·나무 힘이 없어 보이시는 건가요? 알려주시면 더 정확하게 안내드릴게요.", 'bot');
      setChips(followUpChips());
    });
    return;
  }

  // -1.3) 토양+엽면 겸용 등 다용도 제품을 찾을 때 → 유니NK칼 추천 (가격 정보는 안내하지 않음)
  if(isVersatileUseQuestion(msg)){
    showTyping(()=>{
      addBubble("토양에 뿌려도 되고 녹여서 엽면시비도 할 수 있는 제품을 찾으신다면 유니NK칼을 추천드려요. 100% 수용성이라 잔여물 없이 관주 처리도, 입제로 토양 처리도 가능해요. 인산 없이 질소·칼륨·칼슘 위주라 비절 현상 없이 흡수가 빠르고, 칼슘 결핍이나 배꼽썩음 같은 증상에 즉효가 있고 세포막이 튼튼해져 병 저항성도 강화돼요.", 'bot');
      setChips(followUpChips());
    });
    return;
  }

  // -1.2) 벼(수도작) + 유기농업자재 + 밑거름 조합 → 하이그로퍼골드 추천 (성분 상세는 안내하지 않음)
  if(currentCrop === "벼" && isOrganicBaseFertQuestion(msg)){
    showTyping(()=>{
      addBubble("벼(수도작) 밑거름으로 유기농업자재를 찾으신다면 하이그로퍼골드를 추천드려요. 농촌진흥청에 유기농업자재로 공시된 제품이고, 토양 지력을 개선하고 작물 생육에 도움이 되는 미생물 활성을 촉진해줘요. 지효성이 좋아서 벼는 10a(300평)당 80~100kg 정도 밑거름으로 사용하시면 돼요.", 'bot');
      setChips(followUpChips());
    });
    return;
  }

  // -1.1) 관주 또는 하우스(시설재배) 요청 → 임팩트골드 5리터(관주용)를 무조건 추천
  if(isGwanjuOrHouseQuestion(msg)){
    showTyping(()=>{
      addBubble("관주로 사용하실 거면 임팩트골드 5리터(관주용)를 추천드려요. 수세 회복이 빠르고 세력 유지, 토양개량·염류 해소, 뿌리발달 촉진에 도움이 되고 이상기후 피해 회복에도 좋아요. 7~10일 간격으로 1,000평당 5리터씩 관주 처리하시고, 피해 회복이 급할 땐 3~5일 간격으로 2~3회 처리하시면 돼요.", 'bot');
      setChips(followUpChips());
    });
    return;
  }

  // -1) 다른 회사/타사 제품 문의 → 저희 제품 안내 대신 지역 담당자와 상담하도록 연결
  if(isCompetitorQuestion(msg)){
    showTyping(()=>{
      addBubble("다른 회사 제품에 대해서는 제가 안내해드리기 어려워요. 담당 지역 직원과 직접 상담받으실 수 있게 연결해드릴게요.", 'bot');
      if(detectedRegion){
        addStaffCard(detectedRegion);
        setChips(followUpChips());
      } else if(lastKnownRegion){
        addStaffCard(lastKnownRegion);
        setChips(followUpChips());
      } else {
        chipsBox.innerHTML = '';
      }
    });
    return;
  }

  // 0) 담당자/영업직원 등 판매 관련 질문 + 같은 문장에 지역명이 있으면
  //    바로 담당자 이름·연락처만 안내하고 끝낸다
  if(isSalesQuestion(msg)){
    showTyping(()=>{
      if(detectedRegion){
        const staff = REGION_STAFF[detectedRegion];
        if(staff){
          addBubble(`${staff.name} ${staff.phone}`, 'bot');
        } else {
          addStaffCard(detectedRegion);
        }
        setChips(followUpChips());
      } else {
        addBubble("어느 지역인지 시군명으로 말씀해 주세요.", 'bot');
        chipsBox.innerHTML = '';
      }
    });
    return;
  }

  // 0-1) 증상 파악 에스컬레이션 중인 경우 (지역/작물 판단보다 우선)
  if(symptomStage === 1){
    continueSymptomEscalation(msg);
    return;
  }

  // 0-2) 작물명·증상 없이 지역명만 언급한 경우 (예: "청주요", "부산")
  //      → 작물명을 기다리고 있던 중이라도, 지역명만 답했다면 바로 담당자 안내
  //      (지역 답변이 엉뚱하게 작물명으로 잘못 해석되지 않도록 이 체크를 먼저 한다)
  if(detectedRegion){
    const cropInMsg = detectAnyCrop(msg);
    const symptomRanked = matchProducts(msg);
    if(!cropInMsg && symptomRanked.length === 0){
      awaitingCropForExamples = false;
      showTyping(()=>{
        const staff = REGION_STAFF[detectedRegion];
        if(staff){
          addBubble(`${detectedRegion} 지역 담당자는 ${staff.name} ${staff.phone} 입니다.`, 'bot');
        } else {
          addStaffCard(detectedRegion);
        }
        setChips(followUpChips());
      });
      return;
    }
  }

  if(awaitingCropForExamples){
    const cropNamed = detectAnyCrop(msg) || msg;
    const sameCropAsBefore = previousCrop && cropNamed === previousCrop;
    currentCrop = cropNamed;
    awaitingCropForExamples = false;
    previousCrop = null;
    showTyping(()=>{
      if(TOP_ISSUES[currentCrop]){
        if(sameCropAsBefore){
          addBubble("다른 증상이 또 있나요? 자주 발생하는 증상 중에 골라주세요.", 'bot');
        } else {
          addBubble(`${currentCrop} 말씀이시군요. 자주 발생하는 증상 중에 골라주시면 바로 알려드릴게요.`, 'bot');
        }
        startTopIssueFlow(currentCrop);
      } else {
        addBubble(`${currentCrop} 말씀이시군요. 증상이 나타나는 부위를 골라주시면 예시로 좁혀볼게요.`, 'bot');
        showPartCategoryChips();
      }
    });
    return;
  }

  // 1) 작물명에 대한 답변을 기다리고 있던 경우 → 이전 질문과 합쳐서 자연스럽게 답변
  if(pendingQuestion){
    const cropNamed = detectAnyCrop(msg) || msg; // 목록에 없는 작물명도 그대로 인정
    currentCrop = cropNamed;
    const combined = pendingQuestion + " " + msg;
    pendingQuestion = null;
    processSymptom(combined, true);
    return;
  }

  // 2) 이번 메시지에 작물명이 있으면 기억해둔다
  // ⚠ 이미 작물이 정해져 있으면 원칙적으로 덮어쓰지 않는다 — "가지"(나뭇가지) 같은 흔한 단어가
  //   우연히 다른 작물명과 겹쳐서 대화 도중 작물이 바뀌어버리는 걸 방지한다.
  //   다만 "사과"처럼 짧고 명확하게 다른 작물명만 입력하면, 의도적인 전환으로 보고 넘어간다.
  const cropFound = detectAnyCrop(msg);
  if(cropFound && !currentCrop){
    currentCrop = cropFound;
  } else if(cropFound && currentCrop && cropFound !== currentCrop && looksLikeExplicitCropSwitch(msg, cropFound)){
    previousCrop = currentCrop;
    currentCrop = cropFound;
    lastRecommended = null;
    lastSecond = null;
    diseaseStage = 0;
    symptomStage = 0;
    symptomAccumulated = "";
    lastShownIssues = [];
    currentPart = null;
    exampleOffset = 0;
    exampleRound = 0;
    showTyping(()=>{
      addBubble(`${currentCrop} 말씀이시군요. 이어서 도와드릴게요. 자주 발생하는 증상 중에 골라주시면 바로 알려드릴게요.`, 'bot');
      if(TOP_ISSUES[currentCrop]){
        startTopIssueFlow(currentCrop);
      } else {
        showPartCategoryChips();
      }
    });
    return;
  }

  // 3) 아직 작물명을 모르는데, 지역/버튼 응답이 아닌 일반 질문이면 작물명부터 확인
  if(!currentCrop && !isHowToQuestion(msg)){
    pendingQuestion = msg;
    showTyping(()=>{
      addBubble("어떤 작물에 대한 이야기인지 먼저 알려주시겠어요? (예: 수박, 고추, 사과 등)", 'bot');
      chipsBox.innerHTML = '';
    });
    return;
  }

  if(tryAnswerCropInfo(msg)) return;

  // 병명이 이미 명확히 매칭되면(예: "노균병 예방은 어떻게 하나요") "어떻게 하나요"류
  // 사용법 재질문 패턴에 가로채이기 전에 먼저 진단을 보여준다.
  if(currentCrop && CROP_ISSUE_DB[currentCrop]){
    const knownDisease = findCropSpecificIssue(msg);
    if(knownDisease){
      showTyping(()=>{
        answerDiseaseWithCause(knownDisease.cause, msg, knownDisease.seasonMismatch, knownDisease.part, knownDisease.product, knownDisease.companion);
      });
      return;
    }
  }

  if(isHowToQuestion(msg)){
    showTyping(()=>{
      if(lastRecommended){
        addBubble("네, 이렇게 사용하시면 됩니다.", 'bot');
        revealProduct(false);
      } else {
        addBubble("아직 어떤 증상인지 파악이 안 됐어요. 작물 상태를 먼저 말씀해주시겠어요?", 'bot');
        setChips(STARTER_CHIPS);
      }
    });
    return;
  }

  processSymptom(msg, false);
}

function answerDiseaseWithCause(causeText, textForProductMatch, seasonMismatch, part, productOverride, companionKey){
  const ranked = productOverride ? [] : matchProducts(textForProductMatch);
  const productKey = productOverride || (ranked.length ? ranked[0][0] : "himiup");
  const p = PRODUCTS[productKey];
  const mainEffect = p.effect.split(",")[0];
  const seasonNote = seasonMismatch
    ? `\n\n다만 지금(${CURRENT_MONTH}월)은 이 증상이 흔한 시기는 아니라서, 다른 원인일 가능성도 함께 살펴보시는 게 좋아요.`
    : "";
  const rootComboNote = (part === "뿌리" && productKey !== "impactgranule")
    ? ` 뿌리 관련 증상이라, 장기 지속 영양 공급이 되는 임팩트과립을 함께 사용하시면 효과가 더 좋아요.`
    : "";
  // 지정된 병행 제품(companion)이 있으면 함께 고려하도록 안내
  // (제품마다 토양/엽면 등 구체적인 용도 차이는 각 제품 usage에 이미 담겨있으므로,
  //  여기서는 특정 용도를 단정하지 않는 범용 문구를 쓴다)
  const companionNote = (companionKey && PRODUCTS[companionKey])
    ? ` 추가로 ${PRODUCTS[companionKey].name}도 함께 고려해보시면 좋아요.`
    : "";
  // 히미업이 나올 때는 2순위 제품도 함께 안내한다.
  // 실제로 근소한 차이의 2순위 후보가 있으면 그걸, 없으면 범용 보조제품(임팩트과립)을 추천.
  // (뿌리 관련이거나 이미 companion이 안내되는 경우는 중복하지 않는다)
  let secondNote = "";
  if(productKey === "himiup" && part !== "뿌리" && !companionKey){
    const secondKey = (ranked.length > 1 && ranked[1][0] !== "himiup") ? ranked[1][0] : "impactgranule";
    const sp = PRODUCTS[secondKey];
    const spEffect = sp.effect.split(",")[0];
    secondNote = ` 추가로 ${sp.name}${josa(sp.name,["을","를"])} 함께 사용하시면 ${spEffect} 효과까지 기대할 수 있어요.`;
  }

  // 1단계: 원인 설명 (+ 출처 표시)
  addBubble(`${causeText}${seasonNote}\n(출처: 농촌진흥청·농사로 자료 기준)`, 'bot');

  // 2단계: 제품명 없이, 보충하면 좋은 성분부터 안내
  showTyping(()=>{
    addBubbleHTML(`이런 증상에는 보통 ${highlightNutrient(p.nutrient)}${josa(p.nutrient,["이","가"])} 보충되면 도움이 돼요.`, 'bot');

    // 3단계: 그 성분이 들어있는 제품을 자연스럽게 연결
    showTyping(()=>{
      addBubbleHTML(
`${highlightNutrient(p.nutrient)}${josa(p.nutrient,["이","가"])} 들어있는 ${p.name}${josa(p.name,["을","를"])} 사용하시면, ${mainEffect} 효과로 증상 완화에 도움이 될 수 있어요.${rootComboNote}${secondNote}${companionNote}

정확한 병해충 방제는 전문적인 진단을 받아 보시기 바랍니다.`, 'bot');
      lastRecommended = productKey;
      lastSecond = null;
      diseaseStage = 1;
      setChips(causeChips());
      resetSymptomState();
    }, 500);
  }, 500);
}

function resetSymptomState(){
  symptomStage = 0;
  symptomAccumulated = "";
  awaitingCropForExamples = false;
  lastShownIssues = [];
  lastTopIssues = [];
  currentPart = null;
  exampleOffset = 0;
  exampleRound = 0;
  topIssueOffset = 0;
}

// 작물별 "가장 많이 발생하는 증상 TOP10"을 5개씩 보여줌.
// "해당 없음"을 누르면 다음 5개, 10개를 다 보고도 없으면 자유 질문으로 넘어간다.
function startTopIssueFlow(crop){
  topIssueOffset = 0;
  showTopIssueBatch();
}

function showTopIssueBatch(){
  const all = getTopIssues(currentCrop);
  const batch = all.slice(topIssueOffset, topIssueOffset + 5);

  if(batch.length === 0){
    // 10개를 다 봤는데도 없으면 자유롭게 설명하도록 질문으로 전환
    showTyping(()=>{
      addBubble("그럼 어떤 증상인지 조금 더 자세히 말씀해주시겠어요?", 'bot');
      chipsBox.innerHTML = '';
    });
    resetSymptomState();
    return;
  }

  lastTopIssues = batch;
  symptomStage = 3;
  showTyping(()=>{
    addBubble(
      topIssueOffset === 0
        ? "자주 발생하는 증상 중에 비슷한 게 있으면 먼저 골라주세요. 해당하는 게 없으면 '해당 없음'을 누르시고 이어서 자세히 설명해주시면 돼요."
        : "다른 증상도 보여드릴게요. 비슷한 게 있으면 골라주세요."
    , 'bot');
    const chips = batch.map((issue,i) => ({label: issue.symptom, value: "__topissue__"+i}));
    chips.push({label:"해당 없음", value:"__topissue__none"});
    setChips(chips);
  });
}

function handlePickTopIssue(msg){
  const suffix = msg.replace("__topissue__","");
  if(suffix === "none"){
    addBubble("해당 없음", 'user');
    topIssueOffset += 5;
    showTyping(()=>{ showTopIssueBatch(); });
    return;
  }
  const idx = parseInt(suffix, 10);
  const issue = lastTopIssues[idx];
  addBubble(issue ? issue.symptom : suffix, 'user');
  if(issue){
    const fits = seasonFits(extractSeasonMonths(issue.cause), CURRENT_MONTH);
    showTyping(()=>{ answerDiseaseWithCause(issue.cause, currentCrop + " " + issue.label, !fits, issue.part, issue.product, issue.companion); });
  } else {
    showTyping(()=>{
      addBubble("죄송해요, 다시 한번 증상을 말씀해주시겠어요?", 'bot');
      chipsBox.innerHTML = '';
    });
    resetSymptomState();
  }
}

function showPartCategoryChips(){
  symptomStage = 2;
  setChips([
    {label:"잎 관련 증상", value:"__part__잎"},
    {label:"꽃 관련 증상", value:"__part__꽃"},
    {label:"열매(과실) 관련 증상", value:"__part__열매"},
    {label:"줄기 관련 증상", value:"__part__줄기"},
    {label:"뿌리 관련 증상", value:"__part__뿌리"},
  ]);
}

// 부위를 처음 고른 시점: 해당 부위 예시 목록을 5개씩 보여주기 시작
function showIssueExamples(part){
  currentPart = part;
  exampleOffset = 0;
  exampleRound = 0;
  showIssueBatch();
}

// 구체적인 특징 단어 없이 너무 일반적인 표현이라 매칭이 실패했을 때,
// 문맥상 부위(잎/뿌리/줄기/꽃/열매)가 파악되면 되묻지 않고 바로 그 부위의 예시를 보여준다.
function tryShowInferredPartExamples(msg){
  if(!currentCrop) return false;
  const part = inferPartFromText(msg);
  if(!part) return false;
  const issues = getCropIssuesByPart(currentCrop, part);
  if(issues.length === 0) return false;
  showTyping(()=>{
    addBubble(`${part} 관련 증상이시군요. 자주 발생하는 예시 중에 비슷한 게 있으면 골라주세요.`, 'bot');
    showIssueExamples(part);
  });
  return true;
}

/* ------------------------------------------------------------------
   질문이 길어서(여러 내용이 섞여있어서) 정확히 매칭이 안 될 때,
   문장을 단어 단위로 쪼개 각 단어가 어떤 증상 항목과 겹치는지 점수를 매겨
   가장 근접한 후보를 찾는다.
   - 답을 갖고 있는 후보를 찾으면 "이거 맞을까요?"로 먼저 확인받는다(추측을 바로 단정하지 않음).
   - 그래도 답이 없으면 억지로 답하지 않고 담당자에게 자연스럽게 연결한다.
------------------------------------------------------------------- */
const LONG_MSG_THRESHOLD = 15; // 이 길이 이상이면 "긴 질문"으로 보고 단어 단위 분석을 시도
function extractMeaningfulWords(msg){
  return msg.split(/[\s,.!?~]+/).filter(w => w.length >= 2);
}
function findBestFuzzyIssue(msg){
  if(!currentCrop || !CROP_ISSUE_DB[currentCrop]) return null;
  const words = extractMeaningfulWords(msg);
  if(words.length === 0) return null;
  let best = null, bestScore = 0;
  for(const issue of CROP_ISSUE_DB[currentCrop]){
    let score = 0;
    for(const w of words){
      if(issue.symptom.includes(w)) score++;
      else if(issue.keywords.some(k => k.includes(w) || w.includes(k))) score++;
    }
    if(score > bestScore){ bestScore = score; best = issue; }
  }
  return bestScore >= 1 ? best : null;
}
function tryFuzzyConfirmOrStaff(msg){
  if(!currentCrop || msg.length < LONG_MSG_THRESHOLD) return false;
  const candidate = findBestFuzzyIssue(msg);
  if(candidate){
    pendingConfirmIssue = candidate;
    showTyping(()=>{
      addBubble(`혹시 "${candidate.symptom}" 같은 증상 말씀하신 게 맞을까요?`, 'bot');
      setChips([
        {label:"네, 맞아요", value:"__confirmissue__yes"},
        {label:"아니요, 다른 증상이에요", value:"__confirmissue__no"}
      ]);
    });
    return true;
  }
  // 단어 단위로 봐도 답을 찾지 못하면 억지로 답하지 않고 담당자에게 연결한다
  showTyping(()=>{
    addBubble("말씀하신 내용을 정확히 파악하기 어려운 질문이네요. 지역 담당자와 상담하시는 게 좋을 것 같아요.", 'bot');
    if(lastKnownRegion){
      addStaffCard(lastKnownRegion);
      setChips(followUpChips());
    } else {
      addBubble("어느 지역인지 시군명으로 말씀해 주세요.", 'bot');
      chipsBox.innerHTML = '';
    }
  });
  return true;
}


// 지금 부위(currentPart)에서 exampleOffset부터 5개를 보여줌.
// "해당 없음"을 누르면 exampleOffset을 5씩 늘려 다음 5개를 보여주고,
// 이 과정을 최대 3번(exampleRound)까지만 반복한 뒤 담당자에게 넘긴다.
function showIssueBatch(){
  const allIssues = getCropIssuesByPart(currentCrop, currentPart)
    .slice()
    .sort((a,b)=>{
      const fa = seasonFits(extractSeasonMonths(a.cause), CURRENT_MONTH);
      const fb = seasonFits(extractSeasonMonths(b.cause), CURRENT_MONTH);
      if(fa === fb) return 0; // 안정 정렬 - 원래 순서 유지
      return fa ? -1 : 1; // 지금 계절에 흔한 증상을 먼저 보여줌
    });

  if(allIssues.length === 0){
    showTyping(()=>{
      addBubble("해당 부위에 대한 예시가 아직 없어요. 지역 담당자에게 자세히 문의드리는 게 좋을 것 같아요.", 'bot');
      if(lastKnownRegion){ addStaffCard(lastKnownRegion); setChips(followUpChips()); }
      else { chipsBox.innerHTML = ''; }
      resetSymptomState();
    });
    return;
  }

  const batch = allIssues.slice(exampleOffset, exampleOffset + 5);

  // 더 보여줄 예시가 없거나(목록 끝) 이미 3번 다 보여줬으면 담당자로 연결
  if(batch.length === 0 || exampleRound >= 3){
    showTyping(()=>{
      addBubble("정확한 진단이 어려워 지역 담당자에게 문의드리는 게 좋을 것 같아요.", 'bot');
      if(lastKnownRegion){ addStaffCard(lastKnownRegion); setChips(followUpChips()); }
      else { chipsBox.innerHTML = ''; }
    });
    resetSymptomState();
    return;
  }

  lastShownIssues = batch;
  symptomStage = 3;
  showTyping(()=>{
    addBubble(
      exampleOffset === 0
        ? "아래 중에 가장 비슷한 증상을 먼저 골라주세요. 해당하는 게 없으면 '해당 없음'을 누르시고 이어서 자세히 설명해주시면 돼요."
        : "다른 예시도 보여드릴게요. 비슷한 증상이 있으면 골라주세요."
    , 'bot');
    const chips = batch.map((issue,i) => ({label: issue.symptom, value: "__pickissue__"+i}));
    chips.push({label:"해당 없음", value:"__pickissue__none"});
    setChips(chips);
  });
}

function handlePickIssue(msg){
  const suffix = msg.replace("__pickissue__","");
  if(suffix === "none"){
    addBubble("해당 없음", 'user');
    exampleRound += 1;
    exampleOffset += 5;
    showTyping(()=>{ showIssueBatch(); });
    return;
  }
  const idx = parseInt(suffix, 10);
  const issue = lastShownIssues[idx];
  addBubble(issue ? issue.symptom : suffix, 'user');
  if(issue){
    const fits = seasonFits(extractSeasonMonths(issue.cause), CURRENT_MONTH);
    showTyping(()=>{ answerDiseaseWithCause(issue.cause, currentCrop + " " + issue.label, !fits, issue.part, issue.product, issue.companion); });
  } else {
    showTyping(()=>{
      addBubble("죄송해요, 다시 한번 증상을 말씀해주시겠어요?", 'bot');
      setChips(STARTER_CHIPS);
    });
    resetSymptomState();
  }
}

// 1차 질문에 답하기 부족할 때 2차로 상세 설명을 요청
function startSymptomEscalation(msgForMatching){
  symptomStage = 1;
  symptomAccumulated = msgForMatching;
  showTyping(()=>{
    addBubble("말씀하신 내용만으로는 정확히 파악이 어려워요. 증상을 조금 더 자세히 설명해주시겠어요?", 'bot');
    chipsBox.innerHTML = '';
  });
}

// 2차 상세 설명(3차 질문)에 대한 처리: 누적 텍스트로 재매칭 → 실패 시 부위별 예시 단계로
function continueSymptomEscalation(msgForMatching){
  symptomAccumulated += " " + msgForMatching;

  const specific = findCropSpecificIssue(symptomAccumulated);
  if(specific){
    showTyping(()=>{ answerDiseaseWithCause(specific.cause, symptomAccumulated, specific.seasonMismatch, specific.part, specific.product, specific.companion); });
    return;
  }

  const ranked = matchProducts(symptomAccumulated);
  if(ranked.length){
    showTyping(()=>{
      const topKey = ranked[0][0];
      lastRecommended = topKey;
      lastSecond = null;
      questionCount += 1;
      addBubble(PRODUCTS[topKey].cause, 'bot');
      setChips(causeChips());
      resetSymptomState();
    });
    return;
  }

  // 그래도 파악이 어려우면: 예시 DB가 있는 작물이면 부위별 예시로,
  // 작물을 아직 모르면 작물부터 확인, 작물은 알지만 예시 DB가 없으면 바로 담당자 안내
  showTyping(()=>{
    if(currentCrop && TOP_ISSUES[currentCrop]){
      addBubble("정확히 짚어드리기가 어려워요. 자주 발생하는 증상 중에 골라주시면 바로 알려드릴게요.", 'bot');
      startTopIssueFlow(currentCrop);
    } else if(currentCrop && CROP_ISSUE_DB[currentCrop]){
      const inferredPart = inferPartFromText(symptomAccumulated);
      if(inferredPart && getCropIssuesByPart(currentCrop, inferredPart).length > 0){
        addBubble(`${inferredPart} 관련 증상이시군요. 자주 발생하는 예시 중에 비슷한 게 있으면 골라주세요.`, 'bot');
        showIssueExamples(inferredPart);
        return;
      }
      addBubble("정확히 짚어드리기가 어려워요. 증상이 나타나는 부위를 골라주시면 예시로 좁혀볼게요.", 'bot');
      showPartCategoryChips();
    } else if(!currentCrop){
      symptomStage = 0;
      awaitingCropForExamples = true;
      addBubble("어떤 작물이신가요? 작물을 알려주시면 증상 예시를 보여드릴게요.", 'bot');
      chipsBox.innerHTML = '';
    } else {
      addBubble("정확히 짚어드리기가 어려워요. 지역 담당자에게 자세히 문의드리는 게 좋을 것 같아요.", 'bot');
      if(lastKnownRegion){ addStaffCard(lastKnownRegion); setChips(followUpChips()); }
      else { chipsBox.innerHTML = ''; }
      resetSymptomState();
    }
  });
}

function processSymptom(msgForMatching, justLearnedCrop){
  // 재배정보(시기·간격·수확·저장) 질문 우선 처리
  if(tryAnswerCropInfo(msgForMatching)) return;

  // 병 관련 질문 감지
  if(isDiseaseQuestion(msgForMatching)){
    if(diseaseStage >= 1){
      showTyping(()=>{
        addBubble("병 관련해서는 제가 드리는 답변보다 지역 담당자에게 자세히 문의를 부탁드립니다.", 'bot');
        if(lastKnownRegion){
          addStaffCard(lastKnownRegion);
          setChips(followUpChips());
        } else {
          chipsBox.innerHTML = '';
        }
      });
      return;
    }

    // 작물 + 증상이 이미 구체적으로 매칭되면, 되묻지 않고 바로 구체적인 원인으로 답변
    const specific = findCropSpecificIssue(msgForMatching);
    if(specific){
      showTyping(()=>{
        answerDiseaseWithCause(specific.cause, msgForMatching, specific.seasonMismatch, specific.part, specific.product, specific.companion);
      });
      return;
    }

    if(tryFuzzyConfirmOrStaff(msgForMatching)) return;
    if(tryShowInferredPartExamples(msgForMatching)) return;
    startSymptomEscalation(msgForMatching);
    return;
  }

  showTyping(()=>{
    const specific = findCropSpecificIssue(msgForMatching);
    if(specific){
      answerDiseaseWithCause(specific.cause, msgForMatching, specific.seasonMismatch, specific.part, specific.product, specific.companion);
      return;
    }

    const ranked = matchProducts(msgForMatching);

    if(ranked.length === 0){
      if(tryFuzzyConfirmOrStaff(msgForMatching)) return;
      if(tryShowInferredPartExamples(msgForMatching)) return;
      startSymptomEscalation(msgForMatching);
      return;
    }

    // 병명이 확정된 진단(specific)은 아니고 제품 키워드로만 느슨하게 걸린 경우,
    // 질문이 길면 이 느슨한 추정을 바로 주지 않고 먼저 되묻거나 담당자로 연결한다.
    if(tryFuzzyConfirmOrStaff(msgForMatching)) return;

    const topKey = ranked[0][0];
    const topScore = ranked[0][1];
    lastRecommended = topKey;
    lastSecond = null;
    questionCount += 1;

    if(ranked.length > 1 && ranked[1][1] >= topScore && ranked[1][1] > 0 && ranked[1][0] !== topKey){
      lastSecond = ranked[1][0];
    }

    let intro = "";
    if(currentCrop && justLearnedCrop){
      intro = `${currentCrop} 말씀이시군요. `;
    } else if(currentCrop && RESTRICTED_CROPS.includes(currentCrop) && topKey === CROP_RESTRICTED_KEY){
      intro = `${currentCrop} 농사시군요. `;
    }
    addBubble(intro + PRODUCTS[topKey].cause, 'bot');

    if(questionCount >= 3){
      // 같은 고민으로 3회 이상 물어보면 바로 제품 + 지역 담당자를 안내
      showTyping(()=>{
        revealProduct(true);
      }, 400);
    } else {
      setChips(causeChips());
    }
  });
}

sendBtn.onclick = () => handleUserMessage(textInput.value);
textInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') handleUserMessage(textInput.value);
});
